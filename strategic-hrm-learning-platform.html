<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strategic HRM — Interactive Learning Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#a435f0;--purple-d:#8710d8;--ink:#1c1d1f;--ink2:#2d2f31;
  --gray:#6a6f73;--line:#d1d7dc;--line2:#e9ebed;--bg:#fff;--bg2:#f7f9fa;
  --star:#e59819;--green:#1e6055;--green-bg:#eceb98;--red:#b32d0f;
  --purple-lt:#f7f0fd;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px;font-size:clamp(16px,0.9vw + 13px,19px)}
body{font-family:'IBM Plex Sans Thai','Noto Sans SC',Inter,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em;font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.35rem,2vw,1.7rem)}
h3{font-size:1.1rem}
p{margin:0 0 .9em}
a{color:var(--purple-d);text-decoration:none}
.mut{color:var(--gray)}
.wrap{max-width:1340px;margin:0 auto;padding:0 24px}

/* ── TOP BAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:62px;background:#fff;border-bottom:1px solid var(--line);z-index:900;display:flex;align-items:center;gap:14px;padding:0 18px}
.brand{font-family:Inter,sans-serif;font-weight:800;font-size:1.05rem;color:var(--ink);cursor:pointer;border:0;background:none;white-space:nowrap;letter-spacing:-.04em}
.brand span{color:var(--purple)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:4px;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.searchbox{flex:1;max-width:600px;display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--ink);border-radius:99px;padding:8px 16px}
.searchbox input{border:0;background:none;outline:none;width:100%;font-family:inherit;font-size:.87rem;color:var(--ink)}
.topnav{display:flex;align-items:center;gap:6px;margin-left:auto}
.tlink{font-size:.83rem;color:var(--ink);padding:7px 10px;border-radius:4px;cursor:pointer;background:none;border:0;font-family:inherit;white-space:nowrap}
.tlink:hover{color:var(--purple-d)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink);font-family:inherit;font-size:.76rem;font-weight:700;padding:7px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.seg button:hover:not(.on){background:var(--bg2)}

/* ── LAYOUT ── */
.shell{display:grid;grid-template-columns:300px 1fr;margin-top:62px;min-height:calc(100vh - 62px)}
.side{border-right:1px solid var(--line);background:#fff;position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.side-head h4{font-size:.95rem;margin:0 0 10px}
.pbar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--purple);width:0;transition:width .4s}
.pmeta{font-size:.74rem;color:var(--gray);margin-top:7px;display:flex;justify-content:space-between}
.sec-label{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--gray);padding:16px 18px 6px;text-transform:uppercase}
.lec{display:flex;gap:11px;align-items:flex-start;padding:10px 18px;cursor:pointer;border-left:3px solid transparent;font-size:.84rem}
.lec:hover{background:var(--bg2)}
.lec.active{background:var(--purple-lt);border-left-color:var(--purple)}
.lec input{margin:3px 0 0;accent-color:var(--purple);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.lec-t{flex:1}
.lec-t b{display:block;font-weight:500;color:var(--ink)}
.lec-t small{color:var(--gray);font-size:.72rem}
.main{min-width:0;background:#fff}

/* ── HERO ── */
.hero{background:var(--ink);color:#fff;padding:40px 0 44px}
.hero .wrap{max-width:900px;margin:0;padding-left:44px}
.crumb{font-size:.76rem;color:#cec0fa;margin-bottom:12px}
.hero h1{font-size:clamp(1.6rem,3vw,2.2rem);color:#fff;margin-bottom:12px}
.hero p{color:#d1d7dc;font-size:.94rem;max-width:62ch}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;margin-bottom:10px}
.badge{background:var(--green-bg);color:var(--ink);font-weight:700;font-size:.72rem;padding:3px 8px;border-radius:3px}
.stars{color:var(--star);font-weight:700}
.hero-meta{font-size:.78rem;color:#d1d7dc;margin-top:14px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* ── BUTTONS ── */
.btn{font-family:inherit;font-size:.87rem;font-weight:700;border-radius:4px;padding:11px 18px;cursor:pointer;border:1px solid transparent;background:var(--ink);color:#fff;transition:filter .15s}
.btn:hover{filter:brightness(1.35)}
.btn.pp{background:var(--purple)}
.btn.pp:hover{background:var(--purple-d);filter:none}
.btn.out{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.out:hover{background:var(--bg2);filter:none}
.btn.sm{padding:7px 13px;font-size:.79rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* ── SECTIONS ── */
section{padding:38px 0}
.sec-h{max-width:74ch;margin-bottom:22px}
.sec-h p{color:var(--gray);font-size:.9rem;margin:0}

/* ── COURSE CARDS ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}
.card{border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;font-family:inherit;color:inherit;padding:0;display:flex;flex-direction:column;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.16)}
.thumb{height:106px;background:linear-gradient(135deg,#2d2f31,#5b2a86);display:flex;align-items:center;justify-content:center;font-size:2.1rem;position:relative}
.thumb .cn{position:absolute;top:8px;left:10px;font-family:Inter;font-size:.68rem;font-weight:700;color:#fff;background:rgba(0,0,0,.42);padding:2px 7px;border-radius:3px}
.card.done .thumb::after{content:'✓';position:absolute;top:8px;right:10px;background:var(--purple);color:#fff;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.cbody{padding:12px 13px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.cbody h3{font-size:.95rem;margin:0;line-height:1.35}
.cbody .sub{font-size:.73rem;color:var(--gray);font-family:Inter,sans-serif}
.cbody .dsc{font-size:.79rem;color:var(--gray);margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow{display:flex;align-items:center;gap:6px;font-size:.75rem;margin-top:4px}
.crow .sc{font-weight:700;color:#8a6116}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:9px}
.tag{font-size:.68rem;background:var(--bg2);border:1px solid var(--line);color:var(--ink2);padding:2px 7px;border-radius:3px;font-family:Inter,sans-serif}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1200;display:none;padding:26px 14px;overflow-y:auto}
.ov.on{display:block}
.modal{max-width:900px;margin:0 auto;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.mhead{background:var(--ink);color:#fff;padding:20px 26px;display:flex;gap:14px;align-items:flex-start}
.mhead .ic{font-size:1.7rem}
.mhead h3{margin:0;color:#fff;font-size:1.18rem}
.mhead small{color:#cec0fa;font-size:.76rem;font-family:Inter,sans-serif}
.x{margin-left:auto;background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1;opacity:.85}
.x:hover{opacity:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 26px;flex-wrap:wrap;background:#fff}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--gray);font-family:inherit;font-size:.85rem;font-weight:600;padding:13px 14px;cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{color:var(--ink)}
.mbody{padding:22px 26px 30px}
.kbox{border:1px solid var(--line);border-radius:5px;padding:14px 16px;margin-bottom:11px;background:#fff}
.kbox h4{margin:0 0 5px;font-size:.95rem}
.kbox p{margin:0;font-size:.86rem;color:var(--ink2)}
.alert{background:var(--purple-lt);border:1px solid #d9c2f5;border-radius:5px;padding:14px 16px}
.alert h4{margin:0 0 4px;font-size:.92rem;color:var(--purple-d)}
.case{border:1px solid var(--line);border-radius:5px;padding:18px}
.case .lb{display:inline-block;background:var(--ink);color:#fff;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:3px;margin-bottom:7px;font-family:Inter,sans-serif}
ul.clean{margin:0;padding-left:20px;color:var(--ink2);font-size:.86rem}
ul.clean li{margin-bottom:5px}

/* ── FULLSCREEN OVERLAY (TOOLS / QUIZ / REPORT / CERT) ── */
.fullscreen-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1100;display:none;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(3px)}
.fullscreen-ov.on{display:flex;align-items:flex-start;justify-content:center}
.fullscreen-box{background:#fff;width:100%;max-width:1100px;border-radius:8px;box-shadow:0 12px 50px rgba(0,0,0,.35);overflow:hidden;margin:auto}
.fs-head{background:var(--ink);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:14px}
.fs-head h3{margin:0;color:#fff;font-size:1.2rem}
.fs-body{padding:28px;max-height:calc(85vh - 66px);overflow-y:auto}

/* ── QUIZ ── */
.q{border:1px solid var(--line);border-radius:5px;padding:18px;margin-bottom:13px}
.q .qt{font-weight:600;margin-bottom:11px;font-size:.95rem}
.q .qt small{display:block;color:var(--gray);font-weight:400;font-size:.75rem;margin-top:3px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font-family:inherit;font-size:.87rem;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--bg2);border-color:var(--ink)}
.opt i{width:16px;height:16px;border:2px solid var(--gray);border-radius:50%;flex-shrink:0;margin-top:3px;display:block}
.opt.pick{border-color:var(--ink);background:var(--bg2)}
.opt.pick i{border-color:var(--ink);background:radial-gradient(var(--ink) 40%,transparent 44%)}
.opt.ok{border-color:var(--green);background:#eafaf1}
.opt.ok i{border-color:var(--green);background:radial-gradient(var(--green) 40%,transparent 44%)}
.opt.no{border-color:var(--red);background:#fdecea}
.opt.no i{border-color:var(--red);background:radial-gradient(var(--red) 40%,transparent 44%)}
.exp{font-size:.82rem;color:var(--ink2);background:var(--bg2);border-left:3px solid var(--purple);margin-top:9px;padding:10px 13px;display:none;border-radius:0 4px 4px 0}
.exp.on{display:block}

/* ── TOOLS ── */
.tnav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.tnav button{font-family:inherit;font-size:.82rem;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--gray);padding:11px 13px;cursor:pointer;margin-bottom:-1px}
.tnav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tnav button:hover{color:var(--ink)}
.panel{display:none;border:1px solid var(--line);border-radius:6px;padding:24px}
.panel.on{display:block}
.panel>.desc{color:var(--gray);font-size:.87rem;max-width:76ch}
label{display:block;font-size:.78rem;font-weight:600;color:var(--ink2);margin-bottom:5px}
input[type=number],input[type=text],select{width:100%;font-family:inherit;font-size:.87rem;background:#fff;border:1px solid var(--ink);color:var(--ink);border-radius:4px;padding:9px 11px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:16px 0}
.subh{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--purple-d);margin:18px 0 0}
table{width:100%;border-collapse:collapse;font-size:.83rem;margin-top:8px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left}
th{color:var(--gray);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.out{margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:18px}
.out .big{font-size:1.75rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;font-family:Inter,sans-serif}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:3px;background:var(--line2);color:var(--ink2)}
.pill.g{background:#eafaf1;color:var(--green)}
.pill.y{background:#fdf4e3;color:#8a6116}
.pill.r{background:#fdecea;color:var(--red)}
.row-del{background:none;border:0;color:var(--red);cursor:pointer;font-size:.95rem}

/* ── REPORT ── */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:6px;padding:17px}
.stat b{display:block;font-size:1.8rem;font-family:Inter,sans-serif;font-weight:800}
.stat span{font-size:.79rem;color:var(--gray)}
.chrow{display:grid;grid-template-columns:minmax(110px,250px) 1fr 54px;gap:12px;align-items:center;margin-bottom:8px;font-size:.83rem}
.chrow .tr{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.chrow .tr>i{display:block;height:100%;border-radius:99px}

/* ── CERT ── */
.cert{border:3px double #b8912f;border-radius:4px;padding:clamp(26px,5vw,48px);text-align:center;background:#fffdf7}
.cert .seal{font-size:2.3rem}
.cert h3{font-family:Inter,sans-serif;letter-spacing:.14em;color:#8a6116;font-size:.86rem;text-transform:uppercase;margin-bottom:18px}
.cert .nm{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;border-bottom:1px solid var(--line);display:inline-block;padding:0 28px 7px;margin-bottom:13px}
.cert .meta{color:var(--ink2);font-size:.86rem}
.cfoot{display:flex;justify-content:space-around;margin-top:30px;flex-wrap:wrap;gap:18px;font-size:.76rem;color:var(--gray)}
footer{border-top:1px solid var(--line);padding:26px 0 46px;color:var(--gray);font-size:.8rem}

@media(max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:62px;left:0;width:290px;z-index:880;transform:translateX(-100%);transition:transform .22s;box-shadow:2px 0 14px rgba(0,0,0,.14)}
  .side.open{transform:none}
  .burger{display:block}
  .searchbox{display:none}
  .hero .wrap{padding-left:24px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
@media print{
  .topbar,.side,.hero,footer,.btn,.noprint,#toolsOv,#chapters,#quiz,#report,.fs-head{display:none!important}
  .fullscreen-ov{position:static!important;background:none!important;padding:0!important;display:block!important;backdrop-filter:none!important}
  .fullscreen-box{box-shadow:none!important;max-width:100%;margin:0}
  .fs-body{padding:0!important;max-height:none!important;overflow:visible!important}
  body{background:#fff;color:#111}
  .cert{border-color:#b8912f}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
  <button class="brand" onclick="scrollTo({top:0,behavior:'smooth'})">Strategic<span>HRM</span></button>
  <div class="searchbox"><span>🔍</span><input id="srch" oninput="doSearch()" placeholder=""></div>
  <div class="topnav">
    <button class="tlink" data-k="navTool" onclick="openToolsModal()"></button>
    <button class="tlink" data-k="navQuiz" onclick="openQuizModal()"></button>
    <button class="tlink" data-k="navCert" onclick="openQuizModal('certsec')"></button>
    <div class="seg"><button onclick="fontSize(-1)">A−</button><button onclick="fontSize(1)">A+</button></div>
    <div class="seg" id="langbar">
      <button data-l="th" onclick="setLang('th')">TH</button>
      <button data-l="en" onclick="setLang('en')">EN</button>
      <button data-l="zh" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</div>

<div class="shell">
  <aside class="side" id="side">
    <div class="side-head">
      <h4 data-k="sideTitle"></h4>
      <div class="pbar"><i id="pbar"></i></div>
      <div class="pmeta"><span id="pTxt">0 / 11</span><span id="pPct">0%</span></div>
    </div>
    <div class="sec-label" data-k="sideSec"></div>
    <div id="lecList"></div>
  </aside>

  <main class="main">
    <div class="hero">
      <div class="wrap">
        <div class="crumb" data-k="crumb"></div>
        <h1 data-k="heroH1"></h1>
        <p data-k="heroLead"></p>
        <div class="rate" style="margin-top:14px">
          <span class="badge" data-k="badge"></span>
          <span class="stars">4.8 ★★★★★</span>
          <span style="color:#cec0fa" data-k="ratings"></span>
        </div>
        <div class="hero-meta" data-k="heroMeta"></div>
        <div class="hero-cta">
          <button class="btn pp" data-k="btnStart" onclick="openM(0)"></button>
          <button class="btn out" data-k="btnSkip" onclick="openToolsModal()"></button>
        </div>
      </div>
    </div>

    <div class="wrap">
      <section id="chapters">
        <div class="sec-h"><h2 data-k="secChH"></h2><p data-k="secChP"></p></div>
        <div id="grid" class="grid"></div>
      </section>
    </div>

    <footer class="wrap"><p data-k="footer"></p></footer>
  </main>
</div>

<!-- Fullscreen overlay: Interactive Tools -->
<div class="fullscreen-ov" id="toolsOv" onclick="if(event.target===this)closeToolsModal()">
  <div class="fullscreen-box">
    <div class="fs-head">
      <h3 data-k="secToolH"></h3>
      <button class="x" onclick="closeToolsModal()" style="margin-left:auto">×</button>
    </div>
    <div class="fs-body">
      <p class="mut" style="margin-top:0" data-k="secToolP"></p>
      <div class="tnav" id="tnav"></div>
      <div id="panels"></div>
      <div id="toolPager" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"></div>
    </div>
  </div>
</div>

<!-- Fullscreen overlay: Quiz, Report & Certificate -->
<div class="fullscreen-ov" id="quizOv" onclick="if(event.target===this)closeQuizModal()">
  <div class="fullscreen-box">
    <div class="fs-head">
      <h3 data-k="secQuizH"></h3>
      <button class="x" onclick="closeQuizModal()" style="margin-left:auto">×</button>
    </div>
    <div class="fs-body">
      <section id="quiz" style="padding-top:0">
        <div class="sec-h"><p data-k="secQuizP"></p></div>
        <div id="quizBox"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center">
          <button class="btn pp" data-k="btnGrade" onclick="grade()"></button>
          <button class="btn out" data-k="btnReset" onclick="resetQuiz()"></button>
          <span id="qStatus" class="mut" style="font-size:.82rem"></span>
        </div>
      </section>

      <section id="report" style="border-top:1px solid var(--line)">
        <div class="sec-h"><h2 data-k="secRepH"></h2><p data-k="secRepP"></p></div>
        <div id="reportBox"></div>
      </section>

      <section id="certsec" style="border-top:1px solid var(--line)">
        <div class="sec-h noprint"><h2 data-k="secCertH"></h2><p data-k="secCertP"></p></div>
        <div id="certArea"></div>
      </section>
    </div>
  </div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)closeM()"><div class="modal" id="modal"></div></div>

<script>
/*══ 1. UI STRINGS ══*/
const UI={

 swot:{t:'SWOT และ TOWS Strategy Builder',d:'กรอกปัจจัยภายในและภายนอกได้หมวดละสูงสุด 5 รายการ ระบบจะจับคู่เป็นกลยุทธ์สี่กลุ่มให้อัตโนมัติ พร้อมตรวจว่าเขียนผิดประเภทหรือไม่',f:['จุดแข็ง (ภายใน)','จุดอ่อน (ภายใน)','โอกาส (ภายนอก)','อุปสรรค (ภายนอก)'],ph:['เช่น ทีมช่างเทคนิคมีประสบการณ์เฉลี่ย 12 ปี','เช่น อัตราลาออกพนักงานใหม่ปีแรก 45%','เช่น แรงงานในพื้นที่ยังไม่ถูกคู่แข่งดึงไป','เช่น คู่แข่งจากส่วนกลางเข้ามาเปิดสาขา'],so:'SO · กลยุทธ์เชิงรุก',st:'ST · กลยุทธ์ป้องกัน',wo:'WO · กลยุทธ์แก้ไข',wt:'WT · กลยุทธ์ตั้งรับ',soD:(s,o)=>`ใช้จุดแข็ง "${s}" เพื่อคว้าโอกาส "${o}" ให้เร็วกว่าคู่แข่ง`,stD:(s,t)=>`ใช้จุดแข็ง "${s}" เป็นเกราะรับมืออุปสรรค "${t}"`,woD:(w,o)=>`เร่งปิดจุดอ่อน "${w}" เพื่อไม่ให้พลาดโอกาส "${o}"`,wtD:(w,t)=>`ลดความเสี่ยงจากจุดอ่อน "${w}" ที่จะถูกซ้ำเติมด้วย "${t}"`,warnIn:'⚠ จุดแข็งและจุดอ่อนต้องเป็นปัจจัยภายในที่องค์กรควบคุมได้ ลองตรวจอีกครั้งว่าไม่ได้เขียนเรื่องตลาดหรือคู่แข่งลงในช่องนี้',empty:'กรอกให้ครบทั้งสี่ช่องเพื่อสร้างกลยุทธ์'},
 fun:{t:'Recruitment Funnel Analyzer',d:'กรอกจำนวนผู้สมัครแต่ละขั้น ระบบคำนวณอัตราผ่านและชี้ว่าคอขวดอยู่ตรงไหน',f:['ผู้สมัครทั้งหมด (คน)','ผ่านคัดกรองใบสมัคร (คน)','เข้าสัมภาษณ์ (คน)','ได้รับข้อเสนอ (คน)','ตอบรับเข้าทำงาน (คน)'],c:['ขั้นตอน','จำนวน','อัตราผ่านจากขั้นก่อน'],stage:['ผู้สมัคร','ผ่านคัดกรอง','เข้าสัมภาษณ์','ได้รับข้อเสนอ','ตอบรับงาน'],overall:'อัตราแปลงรวมจากผู้สมัครถึงรับเข้าทำงาน',bn:'คอขวดอยู่ที่',diag:{scr:'ขั้นคัดกรอง — ผู้สมัครไม่ตรงคุณสมบัติ ให้ทบทวนช่องทางประกาศและข้อความในประกาศรับสมัคร',int:'ขั้นสัมภาษณ์ — เกณฑ์คัดกรองอาจหลวมเกินไป ควรใช้แบบประเมินเชิงโครงสร้างตั้งแต่รอบแรก',off:'ขั้นให้ข้อเสนอ — ผู้สมัครผ่านสัมภาษณ์น้อย ควรทบทวนมาตรฐานการสัมภาษณ์และ competency ที่ใช้',acc:'ขั้นตอบรับข้อเสนอ — คนอยากได้แต่เขาปฏิเสธ แปลว่าค่าตอบแทนหรือ EVP ไม่แข่งขัน ให้ทำ Salary Benchmark ก่อนทุ่มงบโฆษณา'}},
 roi:{t:'Training ROI Calculator',d:'วัดผลตอบแทนการฝึกอบรมระดับที่ 4 ของ Kirkpatrick โดยแปลงผลลัพธ์เชิงปฏิบัติการเป็นตัวเงิน แล้วเทียบกับต้นทุนรวมทั้งทางตรงและทางอ้อม',secB:'ผลประโยชน์ที่วัดเป็นเงินได้',secC:'ต้นทุนการฝึกอบรม',b:['จำนวนผู้เข้าอบรม (คน)','มูลค่าผลลัพธ์ที่ดีขึ้นต่อคนต่อปี (บาท)','สัดส่วนที่เชื่อว่าเกิดจากการอบรมจริง (%)','ระดับความมั่นใจในการประมาณการ (%)'],c:['ค่าวิทยากรและหลักสูตร (บาท)','ค่าสถานที่ อาหาร เอกสาร (บาท)','ค่าเดินทางและที่พัก (บาท)','ค่าแรงผู้เข้าอบรมระหว่างอบรม (บาท)','ค่าบริหารจัดการของฝ่าย HR (บาท)'],r:['ผลประโยชน์รวมก่อนปรับค่า','ผลประโยชน์สุทธิหลังปรับ Isolation และ Confidence','ต้นทุนรวมทั้งหมด','กำไรสุทธิจากการอบรม','Benefit-Cost Ratio (BCR)','ระยะเวลาคืนทุน'],month:'เดือน',never:'ยังไม่คืนทุน',lbl:'ผลตอบแทนการลงทุนด้านการฝึกอบรม',hi:'คุ้มค่ามาก ควรขยายผลไปกลุ่มอื่น',md:'คุ้มทุน อยู่ในเกณฑ์ที่ยอมรับได้',lo:'ยังไม่คุ้มทุน ควรทบทวนเนื้อหาหลักสูตรหรือวิธีติดตามผลหลังอบรม',note:'สูตร ROI = (ผลประโยชน์สุทธิ − ต้นทุนรวม) ÷ ต้นทุนรวม × 100 ตัวคูณ Isolation ใช้ตัดผลที่เกิดจากปัจจัยอื่น เช่น ระบบใหม่หรือฤดูกาล ส่วน Confidence คือความมั่นใจของผู้ประมาณการ ทั้งสองตัวช่วยให้ตัวเลขน่าเชื่อถือต่อผู้บริหารการเงิน'}},

 roi:{t:'Training ROI calculator',d:'Measure training return at Kirkpatrick Level 4 by converting operational results into money, then comparing against total direct and indirect costs.',secB:'Monetized benefits',secC:'Training costs',b:['Number of participants','Improved result value per person per year','Isolation factor — share truly caused by training (%)','Confidence level in the estimate (%)'],c:['Trainer and course fees','Venue, catering and materials','Travel and accommodation','Participant wages during training','HR administration cost'],r:['Gross benefit before adjustment','Net benefit after isolation and confidence','Total cost','Net gain from training','Benefit-Cost Ratio (BCR)','Payback period'],month:'months',never:'No payback yet',lbl:'Return on training investment',hi:'Highly worthwhile — consider scaling to other groups',md:'Worthwhile, within an acceptable range',lo:'Not yet worthwhile — review course content or post-training follow-up',note:'ROI = (Net benefit − Total cost) ÷ Total cost × 100. The isolation factor strips out results caused by other factors such as new systems or seasonality; confidence reflects estimator certainty. Both make the figure credible to finance executives.'}},

  q:[{q:'ข้อใดจัดเป็น Weakness ตามหลัก SWOT ที่ถูกต้อง',o:['ค่าแรงขั้นต่ำปรับขึ้น','คู่แข่งรายใหญ่เข้ามาในพื้นที่','อัตราลาออกของพนักงานใหม่ในปีแรกสูงถึง 45%','กำลังซื้อผู้บริโภคชะลอตัว'],a:2,e:'Weakness ต้องเป็นปัจจัยภายในที่องค์กรควบคุมหรือแก้ไขได้ อีกสามข้อเป็นปัจจัยภายนอก'},{q:'กลยุทธ์กลุ่ม WO ใน TOWS Matrix หมายถึงอะไร',o:['ใช้จุดแข็งคว้าโอกาส','แก้จุดอ่อนเพื่อให้คว้าโอกาสได้','ใช้จุดแข็งรับมืออุปสรรค','ลดความเสียหายจากจุดอ่อนและอุปสรรคพร้อมกัน'],a:1,e:'WO คือ Weakness-Opportunity ปิดจุดอ่อนเพื่อไม่ให้พลาดโอกาสที่เปิดอยู่'}]},
 en:{t:'Strategic Environment Analysis',en:'',sum:'Read the external and internal context using PESTEL, Five Forces and SWOT, then convert insights into strategic options with the TOWS Matrix.',tags:['PESTEL','SWOT/TOWS','VRIO'],
  keys:[{h:'PESTEL',d:'Scan six macro factors — political, economic, social, technological, environmental and legal. For HR, the biggest impacts are usually demographic shifts, labor law, and technology reshaping job content.'},{h:'A usable SWOT',d:'Strengths and weaknesses must be internal, controllable factors; opportunities and threats must be external. The most common mistake is writing a weakness as an external factor, which makes it impossible to fix.'},{h:'TOWS matrix',d:'Pair factors into four strategy groups: SO uses strengths to capture opportunities, ST uses strengths to counter threats, WO fixes weaknesses to capture opportunities, WT defends against weakness and threat together.'},{h:'VRIO and human capital',d:'A resource creating sustainable advantage must be Valuable, Rare, hard to Imitate, and the Organization must exploit it. Embedded team knowledge qualifies; software anyone can buy does not.'}],
  tools:['PESTEL Canvas','SWOT/TOWS Builder','VRIO Checklist'],
  cs:{s:'A regional retailer is expanding stores but cannot find store managers fast enough, while a national competitor is opening in the same area.',a:'Its strength is deep local market knowledge and an existing staff network; the opportunity is local labor not yet poached. The SO strategy is a Store Manager Academy that grows existing department leads into managers within nine months, instead of bidding against competitors on salary.'},
  q:[{q:'Which of the following correctly qualifies as a Weakness under SWOT?',o:['Minimum wage has increased','A major competitor has entered the area','First-year new-hire turnover is as high as 45%','Consumer purchasing power is slowing'],a:2,e:'A weakness must be an internal factor the organization controls or can fix; the other three are external.'},{q:'What does a WO strategy in the TOWS Matrix mean?',o:['Use strengths to capture opportunities','Fix weaknesses so opportunities can be captured','Use strengths to counter threats','Reduce damage from weaknesses and threats simultaneously'],a:1,e:'WO stands for Weakness-Opportunity: closing an internal gap so an open opportunity is not missed.'}]},
 zh:{t:'战略环境分析',en:'',sum:'运用PESTEL、五力模型与SWOT解读内外部环境，再透过TOWS矩阵转化为具体的战略选择。',tags:['PESTEL','SWOT/TOWS','VRIO'],
  keys:[{h:'PESTEL分析',d:'检视六大宏观因素：政治、经济、社会、科技、环境与法律。对人力资源而言，影响最大的通常是人口结构变化、劳动法规，以及改变工作内容本质的科技发展。'},{h:'真正可用的SWOT分析',d:'优势与劣势必须是内部且可控的因素；机会与威胁则必须是外部因素。最常见的错误是把劣势写成外部因素，导致根本无法找到改善的方法。'},{h:'TOWS矩阵',d:'将各项因素两两配对，形成四类战略：SO运用优势掌握机会；ST运用优势应对威胁；WO改善劣势以掌握机会；WT则采防御姿态，同时降低劣势与威胁的风险。'},{h:'VRIO与人力资本',d:'能创造持续竞争优势的资源，必须具备价值性、稀缺性、难以模仿性，且组织本身能有效运用。深植于团队中的隐性知识符合此标准，而任何人都能购买的现成软件则不符合。'}],
  tools:['PESTEL Canvas','SWOT/TOWS Builder','VRIO Checklist'],
  cs:{s:'某区域零售企业正在扩张分店，但门店经理的招募速度始终跟不上，与此同时，来自首都的竞争对手也开始在同一地区开设门市。',a:'该企业的优势在于对本地市场的深入了解以及既有的员工网络；机会则是尚未被挖角的当地人力。对应的SO战略是建立「店长学院」，在九个月内将现有部门主管培养晋升为店长，而不是用更高薪资与对手正面争抢人才。'},
  q:[{q:'根据SWOT分析原则，以下哪一项才属于正确的「劣势」？',o:['最低工资调涨','大型竞争对手进入该地区','新进员工第一年的离职率高达45%','消费者购买力放缓'],a:2,e:'劣势必须是组织能够控制或加以改善的内部因素，其余三项皆属于外部因素。'},{q:'TOWS矩阵中的WO战略是指什么？',o:['运用优势掌握机会','改善劣势以便能够掌握机会','运用优势应对威胁','同时降低劣势与威胁所造成的损害'],a:1,e:'WO即劣势-机会战略：弥补内部短板，以免错失当前已开启的外部机会。'}]}}},
{id:3,ic:'🎯',tool:'kpi',hue:'#7a1f4f',i18n:{
 th:{t:'การถ่ายทอดกลยุทธ์ด้วย Balanced Scorecard',en:'Strategy Map & Balanced Scorecard',sum:'แปลวิสัยทัศน์เป็นแผนที่กลยุทธ์สี่มุมมอง แล้วถ่ายทอดลงเป็น KPI ระดับฝ่ายและระดับบุคคล',tags:['BSC','Strategy Map','Cascading'],
  keys:[{h:'สี่มุมมองของ BSC',d:'การเงิน ลูกค้า กระบวนการภายใน และการเรียนรู้กับการเติบโต โดยมุมมองล่างเป็นเหตุของมุมมองบน ทุนมนุษย์จึงอยู่ฐานล่างสุดของแผนที่กลยุทธ์'},{h:'Strategy Map',d:'เขียนความสัมพันธ์เชิงเหตุผลเป็นลูกศร เช่น เพิ่มทักษะช่างเทคนิค → ลดเวลาซ่อมเครื่อง → ส่งมอบตรงเวลา → ลูกค้าพึงพอใจ → ยอดขายซ้ำเพิ่ม การเขียนแบบนี้ป้องกันการตั้ง KPI ที่ไม่เชื่อมกับผลลัพธ์'},{h:'การ Cascade ลงสู่หน่วยงาน',d:'KPI องค์กรกระจายลงฝ่ายได้สามแบบ แบ่งค่าเป้าหมาย, ใช้ตัวชี้วัดเดียวกันทั้งสายงาน, หรือแปลงเป็นตัวชี้วัดกิจกรรมที่ฝ่ายควบคุมได้จริง'},{h:'Lead vs Lag Indicator',d:'Lag บอกผลที่เกิดแล้ว เช่น ยอดขาย ส่วน Lead บอกสัญญาณล่วงหน้า เช่น จำนวนใบเสนอราคา แผน BSC ที่ดีต้องมีทั้งสองประเภทในสัดส่วนที่สมดุล'}],
  tools:['Strategy Map Canvas','KPI Scorecard Calculator','Cascading Matrix'],
  cs:{s:'บริษัทตั้งเป้ากำไรโต 15% แต่ทุกฝ่ายตั้ง KPI เป็นงานประจำของตัวเอง ปลายปีทุกฝ่ายได้เกรด A แต่กำไรกลับลดลง',a:'อาการนี้เกิดจากไม่มี Strategy Map จึงไม่มีเส้นเชื่อมระหว่าง KPI ฝ่ายกับผลลัพธ์องค์กร ทางแก้คือวาดแผนที่กลยุทธ์ใหม่ กำหนดตัวขับเคลื่อนหลักไม่เกิน 3-4 ตัวต่อมุมมอง แล้วบังคับว่าทุก KPI ของฝ่ายต้องอ้างอิงกลับไปที่วัตถุประสงค์บนแผนที่ได้'},
  q:[{q:'ในแผนที่กลยุทธ์ตามแนวคิด BSC มุมมองใดถือเป็นฐานรากที่ขับเคลื่อนมุมมองอื่น',o:['มุมมองด้านการเงิน','มุมมองด้านลูกค้า','มุมมองกระบวนการภายใน','มุมมองการเรียนรู้และการเติบโต'],a:3,e:'การเรียนรู้และการเติบโตคือทุนมนุษย์ ทุนสารสนเทศ และทุนองค์กร ซึ่งเป็นเหตุของมุมมองที่อยู่สูงขึ้นไป'},{q:'ข้อใดเป็น Leading Indicator',o:['กำไรสุทธิรายไตรมาส','อัตราการลาออกที่เกิดขึ้นแล้ว','จำนวนพนักงานที่ผ่านการรับรองทักษะใหม่ในเดือนนี้','ส่วนแบ่งตลาดปีที่ผ่านมา'],a:2,e:'จำนวนผู้ผ่านการรับรองทักษะเป็นสัญญาณล่วงหน้าของผลิตภาพที่จะเกิดขึ้น อีกสามข้อเป็น Lag Indicator'}]},
 en:{t:'Cascading Strategy with the Balanced Scorecard',en:'',sum:'Translate vision into a four-perspective strategy map, then cascade it into department and individual KPIs.',tags:['BSC','Strategy Map','Cascading'],
  keys:[{h:'Four BSC perspectives',d:'Financial, Customer, Internal Process, and Learning & Growth. Lower perspectives cause the ones above, which is why human capital sits at the base of the strategy map.'},{h:'Strategy map',d:'Draw cause-and-effect arrows, e.g. upskill technicians → shorter repair time → on-time delivery → customer satisfaction → repeat sales. This prevents KPIs that do not connect to outcomes.'},{h:'Cascading to departments',d:'Corporate KPIs cascade three ways: splitting the target, sharing the same metric across a function, or converting it into an activity metric the department directly controls.'},{h:'Lead vs lag indicators',d:'Lag indicators show results that already happened, e.g. sales; lead indicators are early signals, e.g. quotes issued. A good scorecard balances both.'}],
  tools:['Strategy Map Canvas','KPI Scorecard Calculator','Cascading Matrix'],
  cs:{s:'A company set a 15% profit growth target, but every department wrote KPIs for their own routine work. At year end every department scored an A, yet profit fell.',a:'This is caused by having no strategy map linking department KPIs to corporate results. Redraw the strategy map, limit key drivers to three or four per perspective, and require every department KPI to trace back to an objective on the map.'},
  q:[{q:'In a BSC strategy map, which perspective is the foundation that drives the others?',o:['Financial perspective','Customer perspective','Internal process perspective','Learning and growth perspective'],a:3,e:'Learning and growth covers human, information and organizational capital — the root cause of the perspectives above it.'},{q:'Which of the following is a Leading Indicator?',o:['Net profit this quarter','Turnover rate that has already occurred','Number of employees certified in a new skill this month','Market share last year'],a:2,e:'Newly certified employees is an early signal of future productivity; the other three are lagging indicators.'}]},
 zh:{t:'运用平衡计分卡展开战略',en:'',sum:'将愿景转化为涵盖四大构面的战略地图，再逐层展开为部门与个人层级的KPI。',tags:['BSC','Strategy Map','Cascading'],
  keys:[{h:'平衡计分卡的四大构面',d:'财务、顾客、内部流程，以及学习与成长。下层构面是上层构面的成因，因此人力资本位于战略地图的最底层基础。'},{h:'战略地图',d:'以箭头描绘因果关系，例如：提升技术人员技能 → 缩短设备维修时间 → 准时交货 → 顾客满意 → 回购销售增加。如此可避免制定出与最终成果毫无关联的KPI。'},{h:'向部门层层展开',d:'组织层级的KPI可透过三种方式向下展开：分配目标数值、整条业务条线共用同一指标，或转化为该部门真正能掌控的活动性指标。'},{h:'领先指标与落后指标',d:'落后指标反映已发生的结果，例如营业额；领先指标则提供预警信号，例如报价单数量。良好的平衡计分卡必须两者兼具且比例均衡。'}],
  tools:['Strategy Map Canvas','KPI Scorecard Calculator','Cascading Matrix'],
  cs:{s:'某公司设定了利润成长15%的目标，但各部门却各自以自身的日常工作内容制定KPI。年底时所有部门都获得A等评价，公司利润却反而下滑。',a:'这种现象源于缺乏战略地图，导致部门KPI与组织整体成果之间毫无连结。解决方法是重新绘制战略地图，每个构面限定三至四个关键驱动因素，并规定每个部门的KPI都必须能回溯对应到地图上的战略目标。'},
  q:[{q:'在平衡计分卡的战略地图中，哪一个构面是驱动其他构面的根本基础？',o:['财务构面','顾客构面','内部流程构面','学习与成长构面'],a:3,e:'学习与成长构面涵盖人力资本、信息资本与组织资本，是位于其上层各构面的根本成因。'},{q:'以下哪一项属于领先指标？',o:['本季的净利润','已经发生的离职率','本月完成新技能认证的员工人数','去年的市场占有率'],a:2,e:'完成新技能认证的员工人数，是未来生产力表现的提前信号；其余三项皆属于落后指标。'}]}}},
{id:4,ic:'📐',tool:'fte',hue:'#1f5f5b',i18n:{
 th:{t:'การวางแผนกำลังคน',en:'Workforce & Manpower Planning',sum:'คำนวณความต้องการกำลังคนจากปริมาณงานจริง วิเคราะห์ช่องว่าง และวางแผนปิดช่องว่างด้วย Build-Buy-Borrow',tags:['FTE','Demand-Supply Gap','Succession'],
  keys:[{h:'สามวิธีประมาณความต้องการ',d:'Workload Analysis คำนวณจากชั่วโมงงานจริง, Ratio Analysis อิงอัตราส่วนต่อยอดขายหรือต่อลูกค้า, Judgmental ใช้ดุลยพินิจผู้บริหาร วิธีแรกแม่นที่สุดแต่ต้องมีข้อมูลเวลามาตรฐาน'},{h:'การคำนวณ FTE',d:'FTE ที่ต้องการ = ปริมาณงานทั้งปี (ชั่วโมง) ÷ ชั่วโมงทำงานสุทธิต่อคนต่อปี โดยชั่วโมงสุทธิต้องหักวันหยุด วันลา และเวลาที่ไม่ใช่งานหลักออกแล้ว'},{h:'Demand-Supply Gap',d:'อุปทานภายใน = กำลังคนปัจจุบัน − การสูญเสียที่คาดการณ์ + การเลื่อนหรือโอนย้ายเข้า ช่องว่างที่เหลือคือจำนวนที่ต้องสรรหาจากภายนอก'},{h:'Build, Buy, Borrow, Bind',d:'Build พัฒนาคนใน, Buy สรรหาจากนอก, Borrow ใช้ outsource หรือสัญญาจ้าง, Bind รักษาคนสำคัญไว้ ตำแหน่งที่หายากและสำคัญควรเน้น Build กับ Bind มากกว่า Buy'}],
  tools:['FTE Calculator','Succession Planning Matrix','Attrition Forecast'],
  cs:{s:'ฝ่ายบริการลูกค้ารับสายปีละ 180,000 สาย เฉลี่ยสายละ 6 นาที ผู้จัดการขอเพิ่มคน 10 อัตราโดยอ้างว่าคนไม่พอ',a:'แปลงเป็นชั่วโมง 180,000 × 0.1 = 18,000 ชั่วโมงต่อปี ถ้าชั่วโมงสุทธิต่อคนคือ 1,560 ชั่วโมง และอัตราใช้งานจริง 75% จะได้ความต้องการประมาณ 15.4 FTE เทียบกับคนปัจจุบัน 12 คน ช่องว่างคือ 3-4 อัตรา ไม่ใช่ 10 ใช้เครื่องมือในบทนี้คำนวณดูได้'},
  q:[{q:'การคำนวณชั่วโมงทำงานสุทธิต่อคนต่อปีต้องหักสิ่งใดออกจากชั่วโมงตามปฏิทิน',o:['เฉพาะวันหยุดนักขัตฤกษ์','วันหยุด วันลา และเวลาที่ไม่ได้ทำงานหลัก','เฉพาะวันลาพักร้อน','ไม่ต้องหักอะไร'],a:1,e:'ต้องหักทั้งวันหยุดประจำสัปดาห์ วันหยุดนักขัตฤกษ์ วันลาทุกประเภท และเวลาที่ใช้กับงานที่ไม่ใช่ภารกิจหลัก'},{q:'ตำแหน่งที่มีความสำคัญสูงต่อธุรกิจและหาคนในตลาดยาก ควรใช้กลยุทธ์ใดเป็นหลัก',o:['Buy สรรหาจากภายนอกอย่างเดียว','Borrow ใช้ outsource ทั้งหมด','Build และ Bind พัฒนาและรักษาคนใน','ปล่อยว่างไว้จนกว่าจะมีผู้สมัคร'],a:2,e:'ตำแหน่งสำคัญที่หายากมีความเสี่ยงสูงถ้าพึ่งตลาดภายนอก จึงต้องสร้างสายป้อนภายในและมีแผนรักษาคน'}]},
 en:{t:'Workforce and Manpower Planning',en:'',sum:'Calculate headcount demand from real workload, analyze the gap, and close it using Build-Buy-Borrow.',tags:['FTE','Demand-Supply Gap','Succession'],
  keys:[{h:'Three estimation methods',d:'Workload Analysis calculates from actual work hours; Ratio Analysis uses a ratio to sales or customers; Judgmental relies on management judgment. The first is most accurate but needs standard time data.'},{h:'Calculating FTE',d:'Required FTE = total annual workload (hours) ÷ net working hours per person per year, where net hours already exclude holidays, leave and non-core time.'},{h:'Demand-supply gap',d:'Internal supply = current headcount − expected losses + promotions or transfers in. The remaining gap must be recruited externally.'},{h:'Build, buy, borrow, bind',d:'Build develops people internally, Buy hires externally, Borrow uses outsourcing or contracts, Bind retains key talent. Rare, critical roles should lean on Build and Bind rather than Buy.'}],
  tools:['FTE Calculator','Succession Planning Matrix','Attrition Forecast'],
  cs:{s:'A customer service department handles 180,000 calls a year, averaging six minutes each. The manager requests ten more headcount, claiming a shortage.',a:'Converting to hours: 180,000 × 0.1 = 18,000 hours per year. With net hours of 1,560 and 75% real utilization, required FTE is about 15.4 versus 12 current staff — a gap of only three to four, not ten.'},
  q:[{q:'What must be deducted when calculating net working hours per person per year?',o:['Only public holidays','Holidays, leave, and time not spent on core work','Only annual leave','Nothing needs to be deducted'],a:1,e:'You must deduct weekly days off, public holidays, all types of leave, and time on non-core duties.'},{q:'For a role critical to the business and hard to find, which strategy should be the main approach?',o:['Buy — hire externally only','Borrow — outsource everything','Build and Bind — develop and retain internal talent','Leave it vacant until candidates appear'],a:2,e:'Critical, scarce roles are too risky to rely on the external market, so an internal pipeline and retention plan are essential.'}]},
 zh:{t:'人力资源规划',en:'',sum:'依据实际工作量计算人力需求，分析人力缺口，并运用自建、外购、借用等策略加以弥补。',tags:['FTE','Demand-Supply Gap','Succession'],
  keys:[{h:'三种预估人力需求的方法',d:'工作量分析法依实际工时计算；比率分析法依营收或顾客数的比例推算；判断法则仰赖管理者的经验判断。第一种最为精确，但必须具备标准工时数据。'},{h:'FTE全职当量的计算',d:'所需FTE = 全年工作总量（小时）÷ 每人每年净工作时数；净工作时数必须已扣除假日、各类请假，以及非核心工作所耗费的时间。'},{h:'供需缺口分析',d:'内部供给 = 现有人力 − 预估流失人数 + 晋升或调入人数。计算后剩余的缺口，即为必须对外招募的人数。'},{h:'自建、外购、借用、留才',d:'自建是培养内部人才；外购是对外招募；借用是运用外包或合约用工；留才则是保留关键人才。稀缺且关键的职位，应优先着重自建与留才。'}],
  tools:['FTE Calculator','Succession Planning Matrix','Attrition Forecast'],
  cs:{s:'客服部门每年接听18万通电话，平均每通6分钟。部门经理以人手不足为由，要求增加10个人力编制。',a:'换算成工时：180,000 × 0.1 = 每年18,000小时。若每人每年净工时为1,560小时、实际稼动率为75%，则所需人力约为15.4个FTE。与现有的12人相比，实际缺口仅为3至4人，而非10人。'},
  q:[{q:'计算每人每年净工作时数时，必须从日历工时中扣除哪些项目？',o:['仅扣除国定假日','假日、各类请假天数，以及非核心工作所占用的时间','仅扣除年假','不需要扣除任何项目'],a:1,e:'必须扣除每周休息日、国定假日、所有类型的请假，以及花费在非核心职责上的时间。'},{q:'对于业务重要性高且市场上难以寻觅人才的职位，应以哪一种策略为主？',o:['仅采用外购策略，完全对外招募','仅采用借用策略，全面外包','采用自建与留才策略，培养并保留内部人才','让职位持续空缺，直到有应征者出现'],a:2,e:'关键且稀缺的职位若完全依赖外部市场，风险极高，必须建立内部人才梯队并制定留才计划。'}]}}},
{id:5,ic:'⚖️',tool:'je',hue:'#5c4326',i18n:{
 th:{t:'การวิเคราะห์และประเมินค่างาน',en:'Job Analysis & Job Evaluation',sum:'จากการวิเคราะห์งานสู่ JD ที่ใช้ได้จริง แล้วประเมินค่างานด้วยระบบคะแนนปัจจัยเพื่อจัดระดับตำแหน่ง',tags:['Job Description','Point Factor','Grading'],
  keys:[{h:'Job Analysis',d:'เก็บข้อมูลด้วยการสัมภาษณ์ สังเกต แบบสอบถาม หรือบันทึกงานประจำวัน ผลลัพธ์คือ Job Description บอกว่างานคืออะไร และ Job Specification บอกว่าคนทำงานต้องมีคุณสมบัติอะไร'},{h:'หลักการสำคัญของการประเมินค่างาน',d:'ประเมินที่ตัวงาน ไม่ใช่ตัวคนที่นั่งอยู่ในตำแหน่ง ผลงานดีเป็นเรื่องของการขึ้นเงินเดือน ไม่ใช่เหตุผลในการปรับระดับตำแหน่ง'},{h:'วิธีประเมินสี่แบบ',d:'Ranking เรียงลำดับ, Classification จัดเข้าชั้นที่นิยามไว้, Point Factor ให้คะแนนตามปัจจัย, Factor Comparison เทียบปัจจัยกับงานหลัก ระบบ Point Factor โปร่งใสและอธิบายได้ดีที่สุดสำหรับองค์กรขนาดกลางขึ้นไป'},{h:'ปัจจัยที่นิยมใช้',d:'ความรู้และทักษะ, ความซับซ้อนในการแก้ปัญหา, ขอบเขตความรับผิดชอบต่อผลลัพธ์, การบริหารคน, การติดต่อประสานงาน และสภาพการทำงาน แต่ละปัจจัยมีน้ำหนักและระดับย่อย'}],
  tools:['Point Factor Calculator','JD Template','Grade Structure Builder'],
  cs:{s:'หัวหน้าแผนกคนหนึ่งทำงานดีมากจนผู้บริหารอยากปรับขึ้นเป็นระดับผู้จัดการ ทั้งที่ขอบเขตงานเท่าเดิม',a:'ถ้าปรับระดับตำแหน่งตามตัวบุคคล โครงสร้างจะพังทันทีเพราะจะมีผู้จัดการที่ขอบเขตงานไม่เท่ากัน ทางที่ถูกคือให้ค่าตอบแทนพิเศษหรือเลื่อนขั้นในกระบอกเดิม แล้วปรับระดับเมื่อขอบเขตงานเปลี่ยนจริง'},
  q:[{q:'หลักการพื้นฐานที่สุดของการประเมินค่างานคือข้อใด',o:['ประเมินที่ตัวงาน ไม่ใช่ตัวผู้ครองตำแหน่ง','ประเมินจากผลงานย้อนหลังสามปี','ประเมินจากเงินเดือนปัจจุบัน','ประเมินจากอายุงาน'],a:0,e:'Job Evaluation วัดคุณค่าของตำแหน่งงาน ส่วนผลงานและอายุงานเป็นตัวแปรของการบริหารค่าตอบแทนรายบุคคล'},{q:'ข้อใดคือข้อได้เปรียบหลักของวิธี Point Factor เทียบกับ Ranking',o:['ทำได้เร็วกว่าและใช้คนน้อยกว่า','ให้เหตุผลเชิงปริมาณที่อธิบายและตรวจสอบได้','ไม่ต้องมี Job Description','ใช้ได้เฉพาะงานฝ่ายผลิต'],a:1,e:'Point Factor แจกแจงคะแนนรายปัจจัย จึงชี้แจงต่อพนักงานและผู้ตรวจสอบได้ว่าทำไมตำแหน่งหนึ่งสูงกว่าอีกตำแหน่ง'}]},
 en:{t:'Job Analysis and Job Evaluation',en:'',sum:'From job analysis to a usable job description, then evaluate job worth with a point-factor system to grade positions.',tags:['Job Description','Point Factor','Grading'],
  keys:[{h:'Job analysis',d:'Collect data through interviews, observation, questionnaires or work diaries. The output is a Job Description (what the job is) and a Job Specification (what qualifications the jobholder needs).'},{h:'The golden rule',d:'Evaluate the job itself, not the person currently in it. Good performance is a matter of pay increase, not a reason to upgrade the job grade.'},{h:'Four evaluation methods',d:'Ranking orders jobs relatively, Classification slots jobs into defined grades, Point Factor scores jobs on factors, Factor Comparison benchmarks against key jobs. Point Factor is the most transparent for mid-size organizations and above.'},{h:'Common factors used',d:'Knowledge and skill, problem-solving complexity, accountability for results, people management, working relationships, and working conditions. Each factor carries a weight and sub-levels.'}],
  tools:['Point Factor Calculator','JD Template','Grade Structure Builder'],
  cs:{s:'A department head performs excellently, and management wants to promote them to manager even though the scope of the job has not changed.',a:'Promoting the grade based on the person alone will break the structure. The right approach is a special allowance or a step increase within the current grade, and re-grade only once the scope genuinely changes.'},
  q:[{q:'What is the most fundamental principle of job evaluation?',o:['Evaluate the job itself, not the current jobholder','Evaluate based on the last three years of performance','Evaluate based on current salary','Evaluate based on years of service'],a:0,e:'Job Evaluation measures the value of the position; performance and tenure are variables for individual pay management.'},{q:'What is the main advantage of Point Factor over Ranking?',o:['It is faster and needs fewer people','It gives a quantitative, auditable rationale','It does not require a job description','It only works for production jobs'],a:1,e:'Point Factor breaks scores down by factor, so the reasoning behind rankings can be explained and verified.'}]},
 zh:{t:'工作分析与职务评价',en:'',sum:'从工作分析出发，制定真正可用的职位说明书，再以点数因素法评估职位价值，建立职等结构。',tags:['Job Description','Point Factor','Grading'],
  keys:[{h:'工作分析',d:'透过访谈、观察、问卷或工作日志收集资料，产出成果为职位说明书（说明工作内容）与职位规范（说明任职者所需资格条件）。'},{h:'职务评价的核心原则',d:'评价的对象是职位本身，而非目前担任该职位的人员。优异的绩效应反映在加薪上，而不应成为调升职等的理由。'},{h:'四种评价方法',d:'排序法依相对高低排列；分类法归入预先定义的等级；点数因素法依各因素评分；因素比较法则以关键标竿职位为基准。对中大型组织而言，点数因素法最为透明。'},{h:'常用的评价因素',d:'知识与技能、解决问题的复杂度、对成果的责任范围、人员管理、协调沟通，以及工作环境条件。每项因素都有各自的权重与细分等级。'}],
  tools:['Point Factor Calculator','JD Template','Grade Structure Builder'],
  cs:{s:'某位部门主管表现极为出色，管理层希望将其晋升至经理层级，然而其实际工作职责范围其实完全没有改变。',a:'若仅因个人表现就调升职等，职等结构将立即崩坏。正确做法是给予特别津贴，或在现有薪级内晋级，待职责范围确实扩大后，再重新评定职等。'},
  q:[{q:'职务评价最根本的原则是什么？',o:['评价职位本身，而非目前的任职者','依据过去三年的绩效表现进行评价','依据目前的薪资水平进行评价','依据年资长短进行评价'],a:0,e:'职务评价衡量的是职位本身的价值；绩效与年资属于个人薪酬管理的变量。'},{q:'点数因素法相较于排序法，最主要的优势为何？',o:['执行速度更快，所需人力更少','能提供可量化、可解释且可稽核的评价依据','完全不需要职位说明书','仅能适用于生产线相关职位'],a:1,e:'点数因素法依各因素分别列出得分，能清楚说明为何某一职位的评价高于另一职位。'}]}}},
{id:6,ic:'🧩',tool:'cmp',hue:'#3d3a7a',i18n:{
 th:{t:'การบริหารขีดความสามารถ',en:'Competency Management',sum:'ออกแบบ Competency Model สามชั้น วัดช่องว่าง และเชื่อมเข้ากับทุกระบบย่อยของ HR',tags:['Competency Model','Gap Analysis','Proficiency Level'],
  keys:[{h:'โครงสร้างสามชั้น',d:'Core Competency ทุกคนต้องมีตามค่านิยมองค์กร, Managerial Competency สำหรับผู้ที่มีลูกน้อง, Functional Competency เฉพาะสายอาชีพ'},{h:'ระดับความเชี่ยวชาญ',d:'นิยม 5 ระดับ ตั้งแต่รู้พื้นฐาน ทำได้ภายใต้การกำกับ ทำได้เอง สอนคนอื่นได้ จนถึงออกแบบและกำหนดมาตรฐานได้ นิยามแต่ละระดับต้องเขียนเป็นพฤติกรรมที่สังเกตได้'},{h:'Gap Analysis',d:'ช่องว่าง = ระดับที่ตำแหน่งต้องการ − ระดับที่บุคคลมีจริง ช่องว่างตั้งแต่ 2 ระดับขึ้นไปในสมรรถนะที่สำคัญคือความเสี่ยงที่ต้องจัดการก่อน'},{h:'การนำไปใช้',d:'Competency เดียวกันต้องถูกใช้ตลอดวงจร ตั้งแต่ประกาศรับสมัคร คำถามสัมภาษณ์เชิงพฤติกรรม แผนพัฒนา การประเมินผล ไปจนถึงเกณฑ์เลื่อนตำแหน่ง มิฉะนั้นจะกลายเป็นเอกสารที่ไม่มีใครใช้'}],
  tools:['Competency Gap Analyzer','BEI Question Bank','IDP Template'],
  cs:{s:'องค์กรจ้างที่ปรึกษาทำ Competency Dictionary หนา 180 หน้า ผ่านไปสองปีไม่มีใครเปิดใช้',a:'สาเหตุคือทำละเอียดเกินและไม่ผูกกับกระบวนการใด ทางแก้คือตัดเหลือสมรรถนะที่สำคัญจริง 8-12 ตัว เขียนนิยามพฤติกรรมให้สั้น แล้วบังคับใช้ที่จุดเดียวก่อน เช่น ใช้ในแบบสัมภาษณ์ทุกตำแหน่ง'},
  q:[{q:'ข้อใดจัดเป็น Core Competency',o:['การเขียนโปรแกรมภาษา Python','การวิเคราะห์งบการเงิน','การทำงานร่วมกับผู้อื่นตามค่านิยมองค์กร','การสอบเทียบเครื่องมือวัด'],a:2,e:'Core Competency คือสมรรถนะที่ทุกตำแหน่งในองค์กรต้องมีร่วมกัน มักสะท้อนค่านิยมองค์กร ส่วนที่เหลือเป็น Functional'},{q:'เหตุผลหลักที่ Competency Model จำนวนมากไม่ถูกนำไปใช้จริงคืออะไร',o:['องค์กรมีขนาดเล็กเกินไป','ไม่ได้เชื่อมเข้ากับกระบวนการ HR ที่ใช้งานจริง','พนักงานไม่มีวุฒิการศึกษาเพียงพอ','ไม่มีระบบสารสนเทศรองรับ'],a:1,e:'Competency ที่ไม่ผูกกับการสรรหา ประเมิน หรือพัฒนา จะกลายเป็นเอกสารที่ไม่มีแรงจูงใจให้ใครใช้'}]},
 en:{t:'Competency Management',en:'',sum:'Design a three-tier competency model, measure the gap, and link it to every HR sub-system.',tags:['Competency Model','Gap Analysis','Proficiency Level'],
  keys:[{h:'Three-tier structure',d:'Core Competency required of everyone per company values, Managerial Competency for those with direct reports, and Functional Competency specific to each job family.'},{h:'Proficiency levels',d:'Typically five levels, from basic awareness, performing under supervision, performing independently, coaching others, to designing standards. Each level must be written as observable behavior.'},{h:'Gap analysis',d:'Gap = required level − actual level. A gap of two levels or more in a critical competency is a risk that must be addressed first.'},{h:'Putting it to use',d:'The same competency set must be used throughout the cycle — job postings, behavioral interviews, development plans, appraisal and promotion criteria — otherwise it becomes a document nobody uses.'}],
  tools:['Competency Gap Analyzer','BEI Question Bank','IDP Template'],
  cs:{s:'An organization paid consultants to build a 180-page competency dictionary. Two years later, nobody has opened it.',a:'It was too detailed and not tied to any process. Cut it to eight to twelve truly important competencies with short behavioral definitions, then enforce use at one point first — for example, every interview must use it.'},
  q:[{q:'Which of the following is a Core Competency?',o:['Programming in Python','Financial statement analysis','Collaborating with others in line with company values','Calibrating measuring instruments'],a:2,e:'A Core Competency is shared by every position, usually reflecting company values; the rest are Functional.'},{q:'What is the main reason many competency models never get used?',o:['The organization is too small','They are not linked to any real HR process','Employees lack sufficient education','There is no IT system to support them'],a:1,e:'A competency model not tied to recruitment, appraisal or development gives no one a reason to use it.'}]},
 zh:{t:'胜任力管理',en:'',sum:'设计三层级胜任力模型，衡量能力落差，并与人力资源各子系统紧密连结。',tags:['Competency Model','Gap Analysis','Proficiency Level'],
  keys:[{h:'三层级架构',d:'核心胜任力是依组织价值观订定、所有员工都须具备的能力；管理胜任力适用于有下属的管理者；职能胜任力则是各专业职系特有的能力要求。'},{h:'熟练度等级',d:'通常划分五个等级：具备基础认知、能在指导下执行、能独立执行、能指导他人，直到能设计并制定标准。每一等级都必须以可观察的具体行为撰写。'},{h:'落差分析',d:'能力落差 = 职位要求等级 − 个人实际具备等级。关键胜任力出现两级以上落差，即属必须优先处理的组织风险。'},{h:'实际运用方式',d:'同一套胜任力必须贯穿整个人才管理循环——从职缺公告、行为面试题、发展计划、绩效考核到晋升标准都须一致，否则终将沦为无人翻阅的文件。'}],
  tools:['Competency Gap Analyzer','BEI Question Bank','IDP Template'],
  cs:{s:'某组织聘请顾问编制了厚达180页的胜任力字典，然而两年过去，几乎无人翻阅使用。',a:'根源在于内容过于繁琐，且未与任何实际流程连结。应精简为八至十二项真正关键的胜任力，撰写简洁的行为定义，并先在单一环节强制推行，例如所有职位的面试表格。'},
  q:[{q:'以下哪一项属于核心胜任力？',o:['Python程式语言开发','财务报表分析','依循组织价值观与他人协作','量测仪器校准'],a:2,e:'核心胜任力是组织内所有职位共同具备的能力，通常反映组织价值观；其余属于职能胜任力。'},{q:'许多胜任力模型最终无法被实际运用，主因为何？',o:['组织规模过于小型','未与实际运作中的人力资源流程相连结','员工普遍学历不足','缺乏信息系统的支持'],a:1,e:'若未与招聘、考核或培育发展连结，便无法给予任何人使用它的动机。'}]}}},
{id:7,ic:'🎣',tool:'fun',hue:'#0f5e6b',i18n:{
 th:{t:'การสรรหาและคัดเลือกเชิงกลยุทธ์',en:'Strategic Recruitment & Selection',sum:'ออกแบบช่องทางสรรหาให้ตรงกลุ่ม ใช้การสัมภาษณ์เชิงโครงสร้าง และวัดคุณภาพการคัดเลือกด้วยข้อมูล',tags:['EVP','Structured Interview','Quality of Hire'],
  keys:[{h:'Employee Value Proposition',d:'คำตอบว่าทำไมคนเก่งควรเลือกทำงานที่นี่ ประกอบด้วยค่าตอบแทน โอกาสเติบโต ลักษณะงาน วัฒนธรรม และความสมดุลชีวิต EVP ที่ดีต้องเป็นเรื่องจริงที่พนักงานปัจจุบันยืนยันได้'},{h:'ความแม่นยำของเครื่องมือคัดเลือก',d:'การสัมภาษณ์เชิงโครงสร้างและแบบทดสอบความสามารถทั่วไปมีอำนาจทำนายผลงานสูงกว่าการสัมภาษณ์แบบอิสระอย่างชัดเจน การใช้หลายเครื่องมือประกอบกันให้ผลดีกว่าเครื่องมือเดียว'},{h:'BEI',d:'Behavioral Event Interview ถามเหตุการณ์จริงในอดีตตามโครงสร้าง STAR คือสถานการณ์ ภารกิจ การกระทำ และผลลัพธ์ หลีกเลี่ยงคำถามสมมติที่ผู้สมัครตอบตามตำรา'},{h:'ตัวชี้วัดที่ควรติดตาม',d:'Time to Fill, Cost per Hire, Offer Acceptance Rate, Quality of Hire และอัตราการอยู่รอดใน 12 เดือนแรก ตัวสุดท้ายสะท้อนคุณภาพการคัดเลือกได้ดีที่สุด'}],
  tools:['Recruitment Funnel Analyzer','STAR Interview Guide','Selection Scorecard'],
  cs:{s:'ตำแหน่งวิศวกรซ่อมบำรุงเปิดรับ 5 เดือนยังไม่ได้คน ผู้สมัครที่มาสัมภาษณ์ปฏิเสธข้อเสนอเกินครึ่ง',a:'ปัญหาไม่ได้อยู่ที่ต้นทางแต่อยู่ที่ Offer Acceptance Rate ต้องไล่ดู Funnel ทีละขั้น ถ้าคนมาสัมภาษณ์พอแต่ปฏิเสธข้อเสนอ แปลว่าค่าตอบแทนหรือ EVP ไม่แข่งขัน ให้ทำ Salary Benchmark เทียบตลาดในพื้นที่ก่อน'},
  q:[{q:'ตัวชี้วัดใดสะท้อนคุณภาพของการคัดเลือกได้ดีที่สุด',o:['จำนวนใบสมัครที่ได้รับ','ต้นทุนการสรรหาต่อคน','อัตราการอยู่รอดและผลงานของพนักงานใหม่ใน 12 เดือนแรก','จำนวนช่องทางประกาศรับสมัคร'],a:2,e:'ตัวเลขต้นทางบอกแค่ปริมาณ แต่การอยู่รอดและผลงานหลังรับเข้าคือหลักฐานว่าคัดเลือกได้ถูกคน'},{q:'การสัมภาษณ์แบบ BEI เน้นถามเรื่องใด',o:['สถานการณ์สมมติในอนาคต','เหตุการณ์จริงที่ผู้สมัครเคยทำในอดีต','ความรู้ทางทฤษฎี','บุคลิกภาพและความประทับใจแรก'],a:1,e:'BEI ตั้งอยู่บนสมมติฐานว่าพฤติกรรมในอดีตทำนายพฤติกรรมในอนาคตได้ดีที่สุด จึงถามเหตุการณ์จริงตามโครงสร้าง STAR'}]},
 en:{t:'Strategic Recruitment and Selection',en:'',sum:'Design sourcing channels for the right audience, use structured interviews, and measure selection quality with data.',tags:['EVP','Structured Interview','Quality of Hire'],
  keys:[{h:'Employee value proposition',d:'The answer to why talented people should work here: pay, growth, the nature of the work, culture, and work-life balance. A good EVP must be true and verifiable by current employees.'},{h:'Predictive validity of selection tools',d:'Structured interviews and general mental ability tests clearly predict performance better than unstructured interviews. Combining several tools works better than one.'},{h:'BEI',d:'Behavioral Event Interviewing asks about real past events using STAR — Situation, Task, Action, Result. Avoid hypothetical questions candidates can answer by the book.'},{h:'Metrics to track',d:'Time to Fill, Cost per Hire, Offer Acceptance Rate, Quality of Hire, and first-12-month survival rate. The last is the strongest reflection of selection quality.'}],
  tools:['Recruitment Funnel Analyzer','STAR Interview Guide','Selection Scorecard'],
  cs:{s:'A maintenance engineer position has been open for five months with no hire. More than half of candidates who interview reject the final offer.',a:'The problem is not at the top of the funnel but the Offer Acceptance Rate. If enough candidates reach interview but reject the offer, pay or EVP is not competitive. Run a market salary benchmark before spending more on advertising.'},
  q:[{q:'Which metric best reflects the quality of selection?',o:['Number of applications received','Cost per hire','New hires survival and performance in the first 12 months','Number of job posting channels used'],a:2,e:'Top-of-funnel numbers only reflect volume; 12-month survival and performance proves the right person was chosen.'},{q:'What does a BEI interview mainly ask about?',o:['Hypothetical future scenarios','Real events the candidate actually experienced','Theoretical knowledge','Personality and first impression'],a:1,e:'BEI is based on the premise that past behavior best predicts future behavior, using the STAR structure.'}]},
 zh:{t:'战略性招募与甄选',en:'',sum:'设计能精准触及目标族群的招募渠道，运用结构化面试，并以数据衡量甄选质量。',tags:['EVP','Structured Interview','Quality of Hire'],
  keys:[{h:'员工价值主张',d:'回答「为何优秀人才应选择在此工作」，涵盖薪酬、成长机会、工作性质、企业文化与生活平衡。良好的价值主张必须真实，且能获现职员工印证。'},{h:'甄选工具的预测效度',d:'结构化面试与一般心智能力测验，对工作绩效的预测能力明显高于非结构化自由面谈。同时并用多种工具，效果远优于仅依赖单一工具。'},{h:'行为事件面谈法',d:'依循STAR架构——情境、任务、行动、结果——询问过去真实发生的事件。应避免假设性问题，因应征者往往能以教科书式答案轻易应对。'},{h:'应追踪的关键指标',d:'职缺补实天数、单次招募成本、录取接受率、录用质量，以及前12个月留任率。最后一项最能真实反映甄选流程质量。'}],
  tools:['Recruitment Funnel Analyzer','STAR Interview Guide','Selection Scorecard'],
  cs:{s:'某维修工程师职缺已开放招募五个月仍未觅得人选，且前来面试的应征者中，超过半数最终拒绝了录用邀约。',a:'症结不在招募漏斗前端，而在录取接受率。若面试人数已足够，最终却纷纷拒绝，即代表薪酬或员工价值主张缺乏竞争力。应先进行薪资基准比较。'},
  q:[{q:'哪一项指标最能真实反映甄选流程的质量？',o:['所收到的求职申请总数','每位新进人员的平均招募成本','新进员工在前12个月的留任率与实际绩效表现','所使用的职缺公告渠道数量'],a:2,e:'漏斗前端的数字仅反映数量，录用后的留任与绩效才是真正证明「选对了人」的证据。'},{q:'行为事件面谈法主要着重于询问哪一类内容？',o:['未来可能发生的假设性情境','应征者过去实际经历并处理过的真实事件','各项专业理论知识','人格特质与初次见面的第一印象'],a:1,e:'行为事件面谈立基于「过去行为最能预测未来行为」的假设，依循STAR架构询问真实事件。'}]}}},
{id:8,ic:'📚',tool:'roi',hue:'#7a3b1f',i18n:{
 th:{t:'การพัฒนาและเส้นทางความก้าวหน้า',en:'Learning, Development & Career Path',sum:'ออกแบบ Training Roadmap ที่เชื่อมกับ Career Path และพิสูจน์ผลตอบแทนการอบรมด้วยตัวเลขที่ผู้บริหารการเงินยอมรับ',tags:['70:20:10','Kirkpatrick','Training ROI'],
  keys:[{h:'70:20:10',d:'การเรียนรู้เกิดจากการลงมือทำ 70 การเรียนรู้จากผู้อื่น 20 และการอบรมในห้องเรียน 10 แผนพัฒนาที่มีแต่หลักสูตรอบรมจึงตอบโจทย์ได้เพียงส่วนน้อยของการเรียนรู้จริง'},{h:'Training Roadmap',d:'ตารางสองแกน แกนหนึ่งคือระดับตำแหน่งตั้งแต่ปฏิบัติการถึงผู้บริหาร อีกแกนคือกลุ่มสมรรถนะ ช่องในตารางระบุหลักสูตรที่ต้องผ่านในแต่ละระดับ ทำให้พนักงานเห็นเส้นทางของตัวเองล่วงหน้า'},{h:'Career Path',d:'มีทั้งแบบแนวตั้งเลื่อนขึ้นตามสายบังคับบัญชา และแบบ Dual Career Path ที่เปิดสายผู้เชี่ยวชาญคู่ขนานกับสายบริหาร เพื่อไม่บังคับให้ผู้เชี่ยวชาญต้องมาคุมคนเพื่อความก้าวหน้า'},{h:'Kirkpatrick และ ROI ระดับที่ 5',d:'ระดับ 1 ปฏิกิริยา ระดับ 2 การเรียนรู้ ระดับ 3 พฤติกรรม ระดับ 4 ผลลัพธ์ทางธุรกิจ และ Phillips เพิ่มระดับ 5 คือ ROI ที่แปลงผลลัพธ์เป็นเงินแล้วหักต้นทุน ตัวเลขนี้เท่านั้นที่ CFO ยอมรับ'}],
  tools:['Training ROI Calculator','Training Roadmap Matrix','IDP Builder'],
  cs:{s:'ฝ่ายฝึกอบรมจัดหลักสูตรได้ตามแผน 100% คะแนนความพึงพอใจเฉลี่ย 4.6 เต็ม 5 แต่ผู้บริหารถามว่าได้อะไรกลับมา',a:'ตัวเลขทั้งสองอยู่ในระดับ 1 ของ Kirkpatrick เท่านั้น เลือกหลักสูตรสำคัญ 2-3 ตัว กำหนดตัวชี้วัดพฤติกรรมล่วงหน้า ให้หัวหน้างานประเมินซ้ำที่ 90 วัน แล้วแปลงผลปฏิบัติการเช่นของเสียที่ลดลงเป็นตัวเงิน ใส่ใน Training ROI Calculator พร้อมปรับด้วย Isolation Factor'},
  q:[{q:'ตามหลัก 70:20:10 สัดส่วนการเรียนรู้ที่มากที่สุดมาจากอะไร',o:['การอบรมในห้องเรียน','การเรียนรู้จากผู้อื่นและการโค้ช','การลงมือปฏิบัติงานจริง','การอ่านเอกสารด้วยตนเอง'],a:2,e:'70 คือ Experiential Learning การเรียนรู้จากการทำงานจริงและการได้รับมอบหมายงานที่ท้าทาย'},{q:'ในการคำนวณ Training ROI ตัวคูณ Isolation Factor มีไว้เพื่ออะไร',o:['เพื่อเพิ่มมูลค่าผลลัพธ์ให้ดูดีขึ้น','เพื่อตัดผลที่เกิดจากปัจจัยอื่นที่ไม่ใช่การอบรมออกไป','เพื่อคำนวณภาษีของค่าใช้จ่ายการอบรม','เพื่อกระจายต้นทุนไปยังปีถัดไป'],a:1,e:'Isolation Factor คือสัดส่วนที่เชื่อว่าผลลัพธ์เกิดจากการอบรมจริง โดยตัดอิทธิพลของระบบใหม่ ฤดูกาล หรือการเปลี่ยนกระบวนการออก ทำให้ตัวเลข ROI น่าเชื่อถือ'}]},
 en:{t:'Learning, Development and Career Path',en:'',sum:'Design a training roadmap linked to career paths, and prove training return with numbers finance executives accept.',tags:['70:20:10','Kirkpatrick','Training ROI'],
  keys:[{h:'70:20:10',d:'Learning comes from doing (70), from others (20), and from formal training (10). A plan built only on courses covers only a minority of real learning.'},{h:'Training roadmap',d:'A two-axis matrix: job level from operational to executive, and competency clusters. Each cell specifies the course required at that level, so employees see their path in advance.'},{h:'Career path',d:'Includes a vertical path up the chain of command, and a Dual Career Path opening a parallel expert track, so specialists are not forced to manage people just to advance.'},{h:'Kirkpatrick and level 5 ROI',d:'Level 1 Reaction, 2 Learning, 3 Behavior, 4 Business Results — and Phillips adds Level 5 ROI, converting results into money and subtracting cost. Only this number convinces a CFO.'}],
  tools:['Training ROI Calculator','Training Roadmap Matrix','IDP Builder'],
  cs:{s:'The training department delivered 100% of planned courses with 4.6 out of 5 satisfaction, yet management asks what the business actually got back.',a:'Both numbers sit only at Kirkpatrick Level 1. Pick two or three key courses, define expected behavior change in advance, re-assess at 90 days, then convert operational results such as reduced defects into money and enter them into the Training ROI Calculator with an isolation factor.'},
  q:[{q:'According to 70:20:10, where does the largest share of learning come from?',o:['Classroom training','Learning from others and coaching','Hands-on job experience','Reading materials independently'],a:2,e:'The 70 represents experiential learning — learning by doing the actual work and taking challenging assignments.'},{q:'In a Training ROI calculation, what is the isolation factor for?',o:['To inflate the benefit figure','To strip out results caused by factors other than the training','To calculate tax on training expenses','To spread the cost into the following year'],a:1,e:'The isolation factor is the share of the result genuinely attributable to training, removing the influence of new systems, seasonality or process changes.'}]},
 zh:{t:'人才培育与职涯发展路径',en:'',sum:'设计与职涯路径连结的培训蓝图，并以财务主管能接受的数字证明培训的投资报酬。',tags:['70:20:10','Kirkpatrick','Training ROI'],
  keys:[{h:'70:20:10学习法则',d:'70%源自实际动手执行，20%源自向他人学习，仅10%来自课堂培训。若发展计划中只有培训课程，实际上仅涵盖真正学习成效中的一小部分。'},{h:'培训发展蓝图',d:'双轴矩阵表：一轴为职级，从基层作业到高阶主管；另一轴为能力群组。每格明确标示该职级须完成的课程，让员工预先清楚看见自己的发展路径。'},{h:'职涯发展路径',d:'包含沿指挥体系向上晋升的垂直路径，以及开辟与管理职并行的专家职涯双轨制，使专业人才不必为求晋升而被迫转任管理职务。'},{h:'柯克派翠克与第五层次ROI',d:'第一层反应、第二层学习、第三层行为、第四层业务成果，而菲利普斯再增加第五层ROI——将成果转化为金额后扣除成本。唯有此一数字能真正说服财务长。'}],
  tools:['Training ROI Calculator','Training Roadmap Matrix','IDP Builder'],
  cs:{s:'培训部门百分之百达成开课计划，学员平均满意度高达4.6分，然而管理层质疑：公司究竟从中获得了什么实质回报？',a:'两项数字都仅停留在柯克派翠克第一层次。应挑选二至三门关键课程，事先定义预期行为改变，请主管于90天后再次评估，并将不良率下降等营运成果转化为金额，输入培训ROI计算工具并以隔离系数加以调整。'},
  q:[{q:'依据70:20:10法则，占比最高的学习成效来自何处？',o:['课堂中的集中培训','向他人学习以及教练式辅导','实际动手执行工作任务','自行阅读各类书面资料'],a:2,e:'其中的70代表体验式学习，即透过实际执行工作任务及承接具挑战性专案所获得的学习成效。'},{q:'在计算培训投资报酬率时，隔离系数的用途为何？',o:['用以提高效益数字，使其看起来更为亮眼','用以扣除并非由培训所造成的成果部分','用以计算培训费用的相关税额','用以将成本分摊至下一年度'],a:1,e:'隔离系数代表成果中真正归因于培训的比例，藉此排除新系统、季节性或流程变更的影响。'}]}}},
{id:9,ic:'📊',tool:'kpi',hue:'#264d8c',i18n:{
 th:{t:'การบริหารผลการปฏิบัติงาน',en:'Performance Management, KPI & OKR',sum:'ออกแบบ KPI ที่วัดได้จริง เลือกใช้ OKR ให้ถูกสถานการณ์ และบริหารวงจรประเมินผลทั้งปี',tags:['KPI','OKR','Calibration'],
  keys:[{h:'KPI ที่ดี',d:'ต้องมีสูตรคำนวณชัดเจน มีแหล่งข้อมูลที่ตรวจสอบได้ มีผู้รับผิดชอบ และมีค่าเป้าหมายที่ท้าทายแต่เป็นไปได้ KPI ที่เขียนว่าปรับปรุงให้ดีขึ้นโดยไม่มีตัวเลขไม่ถือเป็น KPI'},{h:'KPI กับ OKR ต่างกันอย่างไร',d:'KPI เหมาะกับงานประจำที่ต้องรักษามาตรฐาน ส่วน OKR เหมาะกับเป้าหมายที่ต้องการก้าวกระโดดในช่วงเวลาสั้น องค์กรจำนวนมากใช้ทั้งคู่ควบกัน ไม่ใช่เลือกอย่างใดอย่างหนึ่ง'},{h:'น้ำหนักและการให้คะแนน',d:'น้ำหนักรวมต้องเท่ากับ 100% จำนวน KPI ต่อคนไม่ควรเกิน 5-7 ตัว คะแนนคำนวณจากผลสำเร็จเทียบเป้าหมายคูณน้ำหนัก แล้วรวมเป็นคะแนนถ่วงน้ำหนัก'},{h:'Calibration',d:'การประชุมปรับเทียบมาตรฐานการให้คะแนนระหว่างผู้ประเมิน เพื่อลด Leniency Error และ Halo Effect เป็นขั้นตอนที่ขาดไม่ได้ถ้าจะให้ผลประเมินผูกกับเงินเดือนอย่างเป็นธรรม'}],
  tools:['KPI Scorecard Calculator','OKR Canvas','Calibration Grid'],
  cs:{s:'ผลประเมินประจำปีออกมาว่า 82% ของพนักงานได้เกรดดีถึงดีมาก แต่ผลประกอบการองค์กรต่ำกว่าเป้า',a:'เป็นอาการคลาสสิกของ Leniency Error ร่วมกับ KPI ที่ไม่ท้าทาย แก้สองทางพร้อมกัน ด้านหนึ่งทบทวนค่าเป้าหมายให้อิงฐานผลงานจริงและ benchmark อีกด้านหนึ่งจัดประชุม Calibration ระดับฝ่ายก่อนสรุปเกรด'},
  q:[{q:'ข้อความใดใช้เป็น KPI ได้จริง',o:['ปรับปรุงการบริการให้ดีขึ้น','ลดระยะเวลาตอบกลับลูกค้าเฉลี่ยจาก 24 ชั่วโมงเหลือ 8 ชั่วโมงภายในไตรมาส 4','ใส่ใจลูกค้ามากขึ้น','พัฒนาทีมงานอย่างต่อเนื่อง'],a:1,e:'KPI ต้องระบุตัววัด ค่าฐาน ค่าเป้าหมาย และกรอบเวลา มีเพียงข้อเดียวที่ครบทั้งสี่องค์ประกอบ'},{q:'การประชุม Calibration มีวัตถุประสงค์หลักเพื่ออะไร',o:['กำหนดค่าเป้าหมายของปีถัดไป','ลดความลำเอียงและทำให้มาตรฐานการให้คะแนนระหว่างผู้ประเมินสอดคล้องกัน','คัดเลือกพนักงานดีเด่น','ทบทวนโครงสร้างเงินเดือน'],a:1,e:'Calibration คือการปรับเทียบมาตรฐานผู้ประเมิน เพื่อให้คะแนนเทียบข้ามหน่วยงานได้อย่างเป็นธรรม'}]},
 en:{t:'Performance Management, KPI and OKR',en:'',sum:'Design measurable KPIs, use OKR where it fits, and manage the full-year appraisal cycle.',tags:['KPI','OKR','Calibration'],
  keys:[{h:'What makes a good KPI',d:'It needs a clear formula, a verifiable data source, a clear owner, and a target that is challenging yet achievable. "Improve service" with no number is not a real KPI.'},{h:'KPI vs OKR',d:'KPI suits ongoing work where standards must be maintained; OKR suits breakthrough goals over a short period. Many organizations use both rather than choosing one.'},{h:'Weighting and scoring',d:'Total weight must equal 100%. Each person should have no more than five to seven KPIs. Score equals achievement versus target multiplied by weight.'},{h:'Calibration',d:'A meeting to align rating standards across managers, reducing leniency error and halo effect. Essential if appraisal results are fairly linked to pay.'}],
  tools:['KPI Scorecard Calculator','OKR Canvas','Calibration Grid'],
  cs:{s:'Annual appraisal results show 82% of employees rated good or excellent, yet actual company performance fell below target.',a:'A classic case of leniency error combined with unchallenging KPIs. Review targets against real baselines and benchmarks, and hold a calibration meeting before finalizing ratings.'},
  q:[{q:'Which statement can actually be used as a real KPI?',o:['Improve customer service','Reduce average customer response time from 24 hours to 8 hours by Q4','Care more about customers','Continuously develop the team'],a:1,e:'A KPI needs a metric, a baseline, a target, and a timeframe; only one option contains all four.'},{q:'What is the main purpose of a Calibration meeting?',o:['Setting next year targets','Reducing bias and aligning rating standards across managers','Selecting top-performing employees','Reviewing the salary structure'],a:1,e:'Calibration aligns evaluator standards so ratings can be fairly compared across departments.'}]},
 zh:{t:'绩效管理、KPI与OKR',en:'',sum:'设计真正可衡量的KPI，在适当情境下选用OKR，并妥善管理全年度的绩效评估循环。',tags:['KPI','OKR','Calibration'],
  keys:[{h:'优良KPI的构成要件',d:'必须具备明确的计算公式、可查证的数据来源、清楚的权责归属，以及具挑战性但可达成的目标值。仅写「改善服务品质」而无具体数字，不算真正的KPI。'},{h:'KPI与OKR的差异',d:'KPI适用于须维持既有标准的例行性工作；OKR则适用于短期内追求突破性成长的目标。许多组织是两者并行，而非二择其一。'},{h:'权重设定与计分',d:'所有权重加总必须等于100%，每人的KPI数量不宜超过五至七项。分数为实际达成率对照目标值后乘以权重，最后加总为加权总分。'},{h:'校准会议',d:'由各评估者共同召开，校准彼此评分标准的会议，用以降低宽大误差与月晕效应。若希望绩效结果能公平与薪酬连动，此步骤不可或缺。'}],
  tools:['KPI Scorecard Calculator','OKR Canvas','Calibration Grid'],
  cs:{s:'年度绩效考核结果显示，高达82%的员工获评良好至优良等级，然而公司整体经营绩效却明显低于目标。',a:'这是典型的宽大误差加上KPI目标不具挑战性所导致。应双管齐下：依实际绩效基准与外部标竿重新检视目标值；并在最终评级定案前召开部门层级的校准会议。'},
  q:[{q:'以下哪一段叙述，才能真正作为KPI来使用？',o:['全面改善客户服务品质','于第四季前，将客户平均响应时间从24小时缩短至8小时','对待顾客要更加用心关怀','持续不断地发展培育团队'],a:1,e:'真正的KPI须明确指出衡量指标、基准值、目标值与时间范围；仅有一项同时具备这四要素。'},{q:'召开校准会议的主要目的为何？',o:['共同制定下一年度的各项目标值','降低评分偏差，使各评估者之间的评分标准趋于一致','从中评选出年度杰出优秀员工','全面检讨现行的薪资结构制度'],a:1,e:'校准会议旨在校准所有评估者的评分标准，使跨部门的考核分数能公平地相互比较。'}]}}},
{id:10,ic:'💰',tool:'sal',hue:'#155c3d',i18n:{
 th:{t:'การบริหารค่าตอบแทน',en:'Compensation & Benefits Strategy',sum:'สร้างโครงสร้างเงินเดือนจากผลประเมินค่างาน กำหนดกระบอกเงินเดือน และบริหารการขึ้นเงินเดือนด้วย Compa-ratio',tags:['Salary Structure','Compa-ratio','Pay Mix'],
  keys:[{h:'ความเป็นธรรมสามด้าน',d:'Internal Equity เทียบกันภายในด้วยค่างาน, External Competitiveness เทียบตลาดด้วยผลสำรวจค่าจ้าง, Individual Equity เทียบกันตามผลงานและความสามารถ ทั้งสามต้องสมดุลกัน'},{h:'องค์ประกอบของกระบอกเงินเดือน',d:'Midpoint คือค่ากลางที่สะท้อนราคาตลาดของระดับนั้น, Range Spread คือความกว้างจาก min ถึง max, Midpoint Progression คือระยะห่างระหว่างค่ากลางของแต่ละระดับ ระดับสูงมักมีกระบอกกว้างกว่าระดับล่าง'},{h:'Compa-ratio',d:'เงินเดือนปัจจุบัน ÷ ค่ากลางของกระบอก ค่าที่ต่ำกว่า 0.80 แปลว่ายังใหม่หรือต่ำกว่าตลาด ค่าสูงกว่า 1.20 แปลว่าใกล้เพดาน ควรพิจารณาการเติบโตด้วยวิธีอื่นแทนการขึ้นเงินเดือนตามปกติ'},{h:'Pay Mix',d:'สัดส่วนระหว่างเงินเดือนคงที่ ผลตอบแทนผันแปร และสวัสดิการ ตำแหน่งขายและตำแหน่งบริหารมักมีสัดส่วนผันแปรสูงกว่า เพื่อผูกกับผลลัพธ์'}],
  tools:['Salary Structure Builder','Compa-ratio Analyzer','Merit Increase Matrix'],
  cs:{s:'พนักงานอาวุโสคนหนึ่งเงินเดือนสูงกว่าเพดานของระดับตัวเองแล้ว แต่ผลงานยังดีมากและหัวหน้าขอขึ้นเงินเดือนให้',a:'กรณี Red Circle ไม่ควรขึ้นเงินเดือนเข้าฐานเพราะจะทำให้โครงสร้างเสีย ทางเลือกที่ใช้กันคือจ่ายเป็นเงินก้อนแบบ lump sum ที่ไม่เข้าฐาน หรือถ้าขอบเขตงานขยายจริงให้ประเมินค่างานใหม่เพื่อเลื่อนระดับ'},
  q:[{q:'พนักงานมีเงินเดือน 42,000 บาท ค่ากลางของกระบอกคือ 35,000 บาท Compa-ratio เท่ากับเท่าใด',o:['0.83','1.20','1.07','0.75'],a:1,e:'42,000 ÷ 35,000 = 1.20 หมายความว่าอยู่สูงกว่าค่ากลาง 20% ใกล้เพดานของกระบอก'},{q:'Internal Equity ในการบริหารค่าตอบแทนอาศัยเครื่องมือใดเป็นหลัก',o:['ผลสำรวจค่าจ้างในตลาด','ผลการประเมินค่างาน','ผลประเมินการปฏิบัติงานรายบุคคล','อายุงานของพนักงาน'],a:1,e:'ความเป็นธรรมภายในตั้งอยู่บนค่างานที่ประเมินด้วยเกณฑ์เดียวกัน ส่วนผลสำรวจตลาดใช้กับ External Competitiveness'}]},
 en:{t:'Compensation and Benefits Strategy',en:'',sum:'Build a salary structure from job evaluation results, set salary ranges, and manage increases using Compa-ratio.',tags:['Salary Structure','Compa-ratio','Pay Mix'],
  keys:[{h:'Three dimensions of fairness',d:'Internal Equity compares jobs using evaluation scores; External Competitiveness compares against the market; Individual Equity compares people on performance and ability. All three must balance.'},{h:'Parts of a salary range',d:'Midpoint is the market-anchored center of a grade; Range Spread is min-to-max width; Midpoint Progression is the gap between consecutive midpoints. Higher grades usually have wider ranges.'},{h:'Compa-ratio',d:'Current salary ÷ range midpoint. Below 0.80 suggests new or under market; above 1.20 suggests near the ceiling, where growth should be handled differently.'},{h:'Pay mix',d:'The ratio between fixed salary, variable pay, and benefits. Sales and executive roles carry a higher variable share to tie pay to results.'}],
  tools:['Salary Structure Builder','Compa-ratio Analyzer','Merit Increase Matrix'],
  cs:{s:'A senior employee salary is already above the ceiling of their grade, but performance remains excellent and the supervisor requests another increase.',a:'A Red Circle case — increasing base pay would damage the structure. Common practice is a lump-sum payment outside base salary, or re-evaluating the job if scope genuinely expanded.'},
  q:[{q:'An employee earns 42,000, and the range midpoint is 35,000. What is the Compa-ratio?',o:['0.83','1.20','1.07','0.75'],a:1,e:'42,000 ÷ 35,000 = 1.20, meaning the salary is 20% above midpoint — close to the range ceiling.'},{q:'Which tool is Internal Equity mainly based on?',o:['Market salary surveys','Job evaluation results','Individual performance appraisal results','Employee tenure'],a:1,e:'Internal fairness is based on job value scored with a consistent method; market surveys serve External Competitiveness.'}]},
 zh:{t:'薪酬福利策略管理',en:'',sum:'依职务评价结果建构薪资结构，设定合理薪幅，并运用薪酬比率管理各项调薪作业。',tags:['Salary Structure','Compa-ratio','Pay Mix'],
  keys:[{h:'薪酬公平的三大面向',d:'内部公平性运用职务评价分数在组织内部比较；外部竞争力依薪资调查与市场行情比较；个人公平性则依绩效与能力比较。三者之间必须维持平衡。'},{h:'薪幅结构的组成要素',d:'中位数是依市场行情定锚、代表该职等的中心值；薪幅宽度指最低值到最高值的幅度；中位数级距则是相邻职等中位数之间的差距。职等越高，薪幅通常越宽。'},{h:'薪酬比率',d:'目前薪资除以薪幅中位数。低于0.80通常代表到职未久或薪资低于市场；高于1.20则代表已逼近上限，应以不同于常规调薪的方式处理成长需求。'},{h:'薪酬组合',d:'固定薪资、变动薪酬与各项福利三者之间的配置比例。业务与高阶管理职位通常配置较高比例的变动薪酬，以将所得与绩效紧密连结。'}],
  tools:['Salary Structure Builder','Compa-ratio Analyzer','Merit Increase Matrix'],
  cs:{s:'某位资深员工的薪资早已超过其职等的薪幅上限，但绩效依然优异，主管再次提出为其调薪的请求。',a:'此即典型的「红圈」案例——继续调升底薪势必破坏薪资结构。常见做法是发放不计入底薪的一次性奖金；或若职责范围确实扩大，则重新进行职务评价作为晋升职等的依据。'},
  q:[{q:'某位员工月薪为42,000，其职等薪幅中位数为35,000，其薪酬比率为多少？',o:['0.83','1.20','1.07','0.75'],a:1,e:'42,000 除以 35,000 等于 1.20，代表薪资高出中位数20%，已逼近该薪幅上限。'},{q:'薪酬管理中的内部公平性，主要依据哪一项工具作为判断基础？',o:['外部市场薪资调查报告','职务评价所得出的结果','个人年度绩效考核结果','员工在公司服务的年资'],a:1,e:'内部公平性建立在以一致标准所评估的职位价值之上；市场调查报告则用于评估外部竞争力。'}]}}},
{id:11,ic:'🔮',tool:'met',hue:'#4a2d6b',i18n:{
 th:{t:'HR Analytics และการนำการเปลี่ยนแปลง',en:'HR Analytics, Digital HR & Change',sum:'ยกระดับจากการรายงานย้อนหลังสู่การวิเคราะห์เชิงทำนาย และนำระบบใหม่ให้เกิดการยอมรับจริง',tags:['Predictive Analytics','ADKAR','Kotter'],
  keys:[{h:'สี่ระดับของการวิเคราะห์',d:'Descriptive เกิดอะไรขึ้น, Diagnostic ทำไมจึงเกิด, Predictive จะเกิดอะไรต่อ, Prescriptive ควรทำอะไร องค์กรส่วนใหญ่ติดอยู่ที่ระดับแรกเพราะรายงานแต่ตัวเลขสถิติรายเดือน'},{h:'ตัวชี้วัดที่ผู้บริหารสนใจ',d:'Revenue per Employee, Human Capital ROI, Turnover Cost, Absence Rate และ Internal Fill Rate การนำเสนอควรแปลงเป็นผลกระทบทางการเงินเสมอ'},{h:'ADKAR',d:'การเปลี่ยนแปลงระดับบุคคลต้องผ่านห้าขั้น ตระหนัก ปรารถนา มีความรู้ มีความสามารถ และได้รับการเสริมแรง ถ้าโครงการล้มเหลวให้วินิจฉัยว่าคนติดอยู่ที่ขั้นใด แล้วแก้ที่ขั้นนั้น'},{h:'ความเสี่ยงของ Digital HR',d:'ระบบใหม่ล้มเหลวเพราะข้อมูลตั้งต้นไม่สะอาด กระบวนการเดิมไม่ถูกออกแบบใหม่ก่อนนำระบบมาใช้ และไม่มีเจ้าของข้อมูลที่ชัดเจน เทคโนโลยีไม่แก้ปัญหากระบวนการที่ผิดอยู่แล้ว'}],
  tools:['HR Metrics Dashboard','ADKAR Assessment','Data Quality Checklist'],
  cs:{s:'องค์กรลงทุนระบบ HRIS ใหม่ ผ่านไปหนึ่งปีหัวหน้างานยังส่งใบลาเป็นกระดาษเหมือนเดิม',a:'วินิจฉัยด้วย ADKAR มักพบว่าติดที่ Desire และ Reinforcement คือรู้ว่ามีระบบและใช้เป็น แต่ไม่มีแรงจูงใจให้เปลี่ยน ทางแก้คือปิดช่องทางกระดาษอย่างมีกำหนดเวลา ให้ผู้บริหารระดับสูงใช้ระบบเป็นตัวอย่าง และผูกอัตราการใช้ระบบเข้ากับ KPI ของหัวหน้าฝ่าย'},
  q:[{q:'การวิเคราะห์ที่ตอบคำถามว่าพนักงานกลุ่มใดมีแนวโน้มจะลาออกในหกเดือนข้างหน้า จัดอยู่ในระดับใด',o:['Descriptive','Diagnostic','Predictive','Prescriptive'],a:2,e:'การคาดการณ์เหตุการณ์ในอนาคตคือ Predictive Analytics ส่วน Prescriptive จะไปไกลถึงการเสนอว่าควรทำอะไร'},{q:'พนักงานรู้ว่ามีระบบใหม่และใช้เป็น แต่ยังไม่ยอมเปลี่ยนพฤติกรรม ตามโมเดล ADKAR ควรแก้ที่ขั้นใดเป็นอันดับแรก',o:['Awareness','Desire','Knowledge','Ability'],a:1,e:'เมื่อมีทั้งความรู้และความสามารถแล้วแต่ยังไม่เปลี่ยน แสดงว่าขาดแรงจูงใจหรือความปรารถนาที่จะเปลี่ยน'}]},
 en:{t:'HR Analytics, Digital HR and Change Management',en:'',sum:'Move from backward-looking reporting to predictive analytics, and lead new systems to real adoption.',tags:['Predictive Analytics','ADKAR','Kotter'],
  keys:[{h:'Four levels of analytics',d:'Descriptive — what happened; Diagnostic — why; Predictive — what will happen next; Prescriptive — what should be done. Most organizations stay at the first level with monthly statistics.'},{h:'Metrics executives care about',d:'Revenue per Employee, Human Capital ROI, Turnover Cost, Absence Rate, and Internal Fill Rate. Always translate them into financial impact.'},{h:'ADKAR',d:'Individual change moves through Awareness, Desire, Knowledge, Ability, and Reinforcement. If a project stalls, diagnose which stage people are stuck at.'},{h:'Risks of digital HR',d:'New systems fail because starting data is dirty, old processes are not redesigned first, and there is no clear data owner. Technology cannot fix a broken process.'}],
  tools:['HR Metrics Dashboard','ADKAR Assessment','Data Quality Checklist'],
  cs:{s:'An organization invested in a new HRIS. A year later, supervisors are still submitting leave forms on paper.',a:'ADKAR usually finds the block at Desire and Reinforcement — people know the system and can use it, but have no motivation. Set a firm cutoff for paper, have leaders visibly use the system, and tie usage to department heads KPIs.'},
  q:[{q:'Analysis that answers which employee groups are likely to resign in six months belongs to which level?',o:['Descriptive','Diagnostic','Predictive','Prescriptive'],a:2,e:'Forecasting a future event is Predictive Analytics; Prescriptive goes further to recommend action.'},{q:'Employees know a new system and can use it, but will not change behavior. Under ADKAR, which stage comes first?',o:['Awareness','Desire','Knowledge','Ability'],a:1,e:'If knowledge and ability exist but behavior has not changed, the missing piece is motivation — the Desire stage.'}]},
 zh:{t:'人力资源分析、数字化人资与变革管理',en:'',sum:'从回顾式历史报表提升至预测性分析，并有效领导变革，使新系统真正被组织接纳采用。',tags:['Predictive Analytics','ADKAR','Kotter'],

function salCalc(){
  const u=TL('sal');
  ['mid','n','prog','sp','spi','chk','chkg'].forEach(k=>sS[k]=num($('s_'+k).value));
  const n=Math.max(1,Math.min(15,sS.n)),prog=sS.prog/100,sp0=sS.sp/100,spi=sS.spi/100,rows=[];
  for(let i=0;i<n;i++){const mid=sS.mid*Math.pow(1+prog,i),sp=sp0+spi*i,mn=mid/(1+sp/2),mx=mn*(1+sp);rows.push({g:i+1,mn,mid,mx,sp})}
  $('salBody').innerHTML=rows.map(r=>`<tr><td>G${r.g}</td><td class="num">${fmt(r.mn)}</td><td class="num">${fmt(r.mid)}</td><td class="num">${fmt(r.mx)}</td><td class="num">${fmt(r.sp*100,0)}%</td></tr>`).join('');
  const gi=Math.min(Math.max(1,sS.chkg),n)-1,r=rows[gi],cr=r.mid?sS.chk/r.mid:0;
  let msg,cls;
  if(cr<0.80){msg=u.lo;cls='r'}else if(cr<=1.20){msg=u.mid;cls='g'}else{msg=u.hi;cls='r'}
  $('salOut').innerHTML=`<div class="big">Compa-ratio ${cr.toFixed(2)}</div>
    <p style="margin:4px 0 0">${u.line(fmt(sS.chk),gi+1,fmt(r.mid))} <span class="pill ${cls}">${msg}</span></p>`;
}
