  $('cmpBody').innerHTML=cS.map((r,i)=>{
    const g=Math.max(0,r.r-r.a),p=g*r.c,nm=r.nm!==undefined?r.nm:(u.def[i]||'');
    return `<tr><td><input type="text" value="${nm}" oninput="cmpSet(${i},'nm',this.value)"></td>
    <td><select onchange="cmpSet(${i},'r',this.value)">${lv.map(v=>`<option value="${v}"${v===r.r?' selected':''}>${v}</option>`).join('')}</select></td>
    <td><select onchange="cmpSet(${i},'a',this.value)">${lv.map(v=>`<option value="${v}"${v===r.a?' selected':''}>${v}</option>`).join('')}</select></td>
    <td><select onchange="cmpSet(${i},'c',this.value)">${u.imp.map(v=>`<option value="${v[0]}"${v[0]===r.c?' selected':''}>${v[1]}</option>`).join('')}</select></td>
    <td class="num">${g}</td><td class="num">${p}</td><td><button class="row-del" onclick="cmpDel(${i})">✕</button></td></tr>`}).join('');
  cmpCalc();
}
function cmpSet(i,k,v){cS[i][k]=k==='nm'?v:num(v);k==='nm'?cmpCalc():cmpDraw()}
function cmpAdd(){cS.push({nm:'',r:3,a:1,c:2});cmpDraw()}
function cmpDel(i){if(cS.length>1){cS.splice(i,1);cmpDraw()}}
function cmpCalc(){
  const u=TL('cmp');
  const list=cS.map((r,i)=>({n:r.nm!==undefined?r.nm:(u.def[i]||''),gap:Math.max(0,r.r-r.a),pr:Math.max(0,r.r-r.a)*r.c})).sort((a,b)=>b.pr-a.pr);
  const urg=list.filter(x=>x.gap>=2);
  const plan=x=>x.gap>=3?u.pl[0]:x.gap===2?u.pl[1]:x.gap===1?u.pl[2]:u.pl[3];
  $('cmpOut').innerHTML=`<div class="big">${u.urg(urg.length)}</div>
    <p class="mut" style="margin:4px 0 14px">${u.urgNote}</p>
    <table><thead><tr><th>${u.c2[0]}</th><th class="num">${u.c2[1]}</th><th>${u.c2[2]}</th></tr></thead>
    <tbody>${list.map(x=>`<tr><td>${x.n}</td><td class="num">${x.gap}</td><td class="mut">${plan(x)}</td></tr>`).join('')}</tbody></table>`;
}

let mS={hc:320,sep:58,rev:480000000,cost:96000000,rep:65000,int:35};
function tMET(){
  const u=TL('met');
  $('p_met').innerHTML=`<h3>${u.t}</h3><p class="desc">${u.d}</p><div class="fields">
    ${['hc','sep','rev','cost','rep','int'].map((k,i)=>`<div><label>${u.f[i]}</label><input type="number" id="m_${k}" value="${mS[k]}" oninput="metCalc()"></div>`).join('')}
  </div><div class="out" id="metOut"></div>`;
  metCalc();
}
function metCalc(){
  const u=TL('met');
  ['hc','sep','rev','cost','rep','int'].forEach(k=>mS[k]=num($('m_'+k).value));
  const to=mS.hc?mS.sep/mS.hc*100:0,rpe=mS.hc?mS.rev/mS.hc:0,roi=mS.cost?((mS.rev-mS.cost)/mS.cost):0,tc=mS.sep*mS.rep,pct=mS.rev?tc/mS.rev*100:0;
  let cls='g',lbl=u.ok;
  if(to>=25){cls='r';lbl=u.hi}else if(to>=15){cls='y';lbl=u.md}
  $('metOut').innerHTML=`<div class="big">${fmt(to,1)}%</div>
    <p style="margin:4px 0 14px">${u.sub} <span class="pill ${cls}">${lbl}</span></p>
    <table><tbody>
    <tr><td>${u.r[0]}</td><td class="num"><b>${fmt(tc)}</b></td></tr>
    <tr><td>${u.r[1]}</td><td class="num">${fmt(pct,2)}%</td></tr>
    <tr><td>${u.r[2]}</td><td class="num">${fmt(rpe)}</td></tr>
    <tr><td>${u.r[3]}</td><td class="num">${roi.toFixed(2)}x</td></tr>
    <tr><td>${u.r[4]}</td><td class="num">${fmt(mS.int,0)}%</td></tr></tbody></table>
    <p class="mut" style="margin:12px 0 0;font-size:.82rem">${u.note(fmt(mS.hc*0.05*mS.rep))}</p>`;
}

let wS={s:['','','','',''],w:['','','','',''],o:['','','','',''],t:['','','','','']};
function tSWOT(){
  const u=TL('swot');
  $('p_swot').innerHTML=`<h3>${u.t}</h3><p class="desc">${u.d}</p><div class="fields">
    ${['s','w','o','t'].map((k,i)=>`<div><label>${u.f[i]}</label>
      ${[0,1,2,3,4].map(n=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        <span class="mut" style="width:14px;flex-shrink:0;font-size:.72rem">${n+1}.</span>
        <input type="text" id="w_${k}_${n}" value="${(wS[k][n]||'').replace(/"/g,'&quot;')}" placeholder="${n===0?u.ph[i]:''}" oninput="swotCalc()" style="flex:1">
      </div>`).join('')}
    </div>`).join('')}
  </div><div class="out" id="swotOut"></div>`;
  swotCalc();
}
function swotCalc(){
  const u=TL('swot');
  const vals={};
  ['s','w','o','t'].forEach(k=>{
    vals[k]=[0,1,2,3,4].map(n=>{const el=$('w_'+k+'_'+n);return el?el.value.trim():''}).filter(v=>v);
    wS[k]=[0,1,2,3,4].map(n=>{const el=$('w_'+k+'_'+n);return el?el.value:''});
  });
  const out=$('swotOut');
  if(!vals.s.length||!vals.w.length||!vals.o.length||!vals.t.length){out.innerHTML=`<p class="mut" style="margin:0">${u.empty}</p>`;return}
  const S=vals.s.join('; '),W=vals.w.join('; '),O=vals.o.join('; '),Tt=vals.t.join('; ');
  const ext=['ตลาด','คู่แข่ง','กฎหมาย','เศรษฐกิจ','market','competitor','economy','law','市场','竞争','法规','经济'];
  const bad=ext.some(x=>S.toLowerCase().includes(x)||W.toLowerCase().includes(x));
  out.innerHTML=`
    <div class="kbox" style="border-left:4px solid #1e6055"><h4>${u.so}</h4><p>${u.soD(S,O)}</p></div>
    <div class="kbox" style="border-left:4px solid #264d8c"><h4>${u.st}</h4><p>${u.stD(S,Tt)}</p></div>
    <div class="kbox" style="border-left:4px solid #8a6116"><h4>${u.wo}</h4><p>${u.woD(W,O)}</p></div>
    <div class="kbox" style="border-left:4px solid #b32d0f;margin-bottom:0"><h4>${u.wt}</h4><p>${u.wtD(W,Tt)}</p></div>
    ${bad?`<p class="mut" style="margin:12px 0 0;font-size:.82rem">${u.warnIn}</p>`:''}`;
}

let nS={a:240,b:96,c:32,d:12,e:5};
function tFUN(){
  const u=TL('fun');
  $('p_fun').innerHTML=`<h3>${u.t}</h3><p class="desc">${u.d}</p><div class="fields">
    ${['a','b','c','d','e'].map((k,i)=>`<div><label>${u.f[i]}</label><input type="number" id="n_${k}" value="${nS[k]}" oninput="funCalc()"></div>`).join('')}
  </div><table><thead><tr><th>${u.c[0]}</th><th class="num">${u.c[1]}</th><th class="num">${u.c[2]}</th></tr></thead><tbody id="funBody"></tbody></table><div class="out" id="funOut"></div>`;
  funCalc();
}
function funCalc(){
  const u=TL('fun');
  ['a','b','c','d','e'].forEach(k=>nS[k]=num($('n_'+k).value));
  const v=[nS.a,nS.b,nS.c,nS.d,nS.e],rates=[];
  for(let i=1;i<v.length;i++)rates.push(v[i-1]>0?v[i]/v[i-1]*100:0);
  $('funBody').innerHTML=v.map((x,i)=>`<tr><td>${u.stage[i]}</td><td class="num">${fmt(x,0)}</td><td class="num">${i===0?'—':fmt(rates[i-1],1)+'%'}</td></tr>`).join('');
  const overall=nS.a>0?nS.e/nS.a*100:0;
  let mi=0;rates.forEach((r,i)=>{if(r<rates[mi])mi=i});
  const keys=['scr','int','off','acc'],cls=overall>=3?'g':overall>=1.5?'y':'r';
  $('funOut').innerHTML=`<div class="big">${fmt(overall,2)}%</div>
    <p style="margin:4px 0 14px">${u.overall} <span class="pill ${cls}">${fmt(rates[mi],1)}%</span></p>
    <div class="kbox" style="border-left:4px solid #b32d0f;margin:0"><h4>${u.bn} ${u.stage[mi+1]}</h4><p>${u.diag[keys[mi]]}</p></div>`;
}

let rS={n:25,val:42000,iso:70,conf:80,c1:180000,c2:60000,c3:45000,c4:210000,c5:35000};
function tROI(){
  const u=TL('roi');
  $('p_roi').innerHTML=`<h3>${u.t}</h3><p class="desc">${u.d}</p>
  <div class="subh">${u.secB}</div>
  <div class="fields">${['n','val','iso','conf'].map((k,i)=>`<div><label>${u.b[i]}</label><input type="number" id="r_${k}" value="${rS[k]}" oninput="roiCalc()"></div>`).join('')}</div>
  <div class="subh">${u.secC}</div>
  <div class="fields">${['c1','c2','c3','c4','c5'].map((k,i)=>`<div><label>${u.c[i]}</label><input type="number" id="r_${k}" value="${rS[k]}" oninput="roiCalc()"></div>`).join('')}</div>
  <div class="out" id="roiOut"></div>`;
  roiCalc();
}
function roiCalc(){
  const u=TL('roi');
  ['n','val','iso','conf','c1','c2','c3','c4','c5'].forEach(k=>rS[k]=num($('r_'+k).value));
  const gross=rS.n*rS.val,net=gross*(rS.iso/100)*(rS.conf/100),cost=rS.c1+rS.c2+rS.c3+rS.c4+rS.c5;
  const gain=net-cost,roi=cost>0?gain/cost*100:0,bcr=cost>0?net/cost:0,pay=net>0?cost/(net/12):0;
  let cls='r',lbl=u.lo;
  if(roi>=100){cls='g';lbl=u.hi}else if(roi>=0){cls='y';lbl=u.md}
  $('roiOut').innerHTML=`<div class="big">${fmt(roi,1)}%</div>
    <p style="margin:4px 0 14px">${u.lbl} <span class="pill ${cls}">${lbl}</span></p>
    <table><tbody>
    <tr><td>${u.r[0]}</td><td class="num">${fmt(gross)}</td></tr>
    <tr><td>${u.r[1]}</td><td class="num">${fmt(net)}</td></tr>
    <tr><td>${u.r[2]}</td><td class="num">${fmt(cost)}</td></tr>
    <tr><td><b>${u.r[3]}</b></td><td class="num"><b style="color:${gain>=0?'#1e6055':'#b32d0f'}">${fmt(gain)}</b></td></tr>
    <tr><td>${u.r[4]}</td><td class="num">${bcr.toFixed(2)} : 1</td></tr>
    <tr><td>${u.r[5]}</td><td class="num">${pay>0&&pay<=120?fmt(pay,1)+' '+u.month:u.never}</td></tr></tbody></table>
    <p class="mut" style="margin:12px 0 0;font-size:.82rem">${u.note}</p>`;
}

/*══ 11. QUIZ ══*/
function drawQ(){
  let n=0;
  $('quizBox').innerHTML=CH.map((c,ci)=>D(ci).q.map((q,qi)=>{
    n++;const key=ci+'-'+qi,pk=answers[key];
    const opts=q.o.map((o,oi)=>{
      let cl='';
      if(graded&&pk!==undefined)cl=oi===q.a?' ok':(oi===pk?' no':'');
      else if(pk===oi)cl=' pick';
      return `<button class="opt${cl}" id="o_${key}_${oi}"${graded?' disabled':''} onclick="pick('${key}',${oi})"><i></i><span>${o}</span></button>`}).join('');
    const on=graded&&pk!==undefined;
    const ex=pk===q.a?T().correct+q.e:T().answerIs+q.o[q.a]+' — '+q.e;
    return `<div class="q" id="q_${key}"><div class="qt">${T().qNo(n)} ${q.q}<small>${T().chWord(c.id)} · ${D(ci).t}</small></div>
      ${opts}<div class="exp${on?' on':''}" id="x_${key}">${on?ex:''}</div></div>`}).join('')).join('');
  updStatus();
}
function pick(key,oi){
  if(graded)return;
  answers[key]=oi;
  const [ci,qi]=key.split('-').map(Number);
  D(ci).q[qi].o.forEach((_,i)=>$(`o_${key}_${i}`).classList.toggle('pick',i===oi));
  updStatus();
}
function updStatus(){$('qStatus').textContent=T().answered(Object.keys(answers).length,QTOTAL)}
function grade(){
  const done=Object.keys(answers).length;
  if(done<QTOTAL){
    $('qStatus').textContent=T().remain(QTOTAL-done);
    const first=CH.flatMap((c,ci)=>D(ci).q.map((q,qi)=>ci+'-'+qi)).find(k=>!(k in answers));
    if(first)$('q_'+first).scrollIntoView({block:'center'});
    return;
  }
  graded=true;
  lastPer=CH.map((c,ci)=>({ci,ok:D(ci).q.filter((q,qi)=>answers[ci+'-'+qi]===q.a).length,total:D(ci).q.length}));
  drawQ();buildReport(lastPer);$('report').scrollIntoView({behavior:'smooth'});
}
function resetQuiz(){
  answers={};graded=false;lastPer=null;certName='';certRef=null;
  drawQ();
  $('reportBox').innerHTML=`<p class="mut">${T().repEmpty}</p>`;
  $('certArea').innerHTML=`<p class="mut">${T().certEmpty}</p>`;
  $('quiz').scrollIntoView({behavior:'smooth'});
}

/*══ 12. REPORT ══*/
function buildReport(per){
  const ok=per.reduce((s,p)=>s+p.ok,0),pc=ok/QTOTAL*100;
  const weak=per.filter(p=>p.ok/p.total<0.5),strong=per.filter(p=>p.ok===p.total);
  const col=v=>v>=100?'#1e6055':v>=50?'#8a6116':'#b32d0f';
  $('reportBox').innerHTML=`<div class="rgrid">
      <div class="stat"><b style="color:${col(pc)}">${fmt(pc,0)}%</b><span>${T().repTotal(ok,QTOTAL)}</span></div>
      <div class="stat"><b style="color:#1e6055">${strong.length}</b><span>${T().repFull}</span></div>
      <div class="stat"><b style="color:#b32d0f">${weak.length}</b><span>${T().repWeak}</span></div>
      <div class="stat"><b style="color:${pc>=70?'#1e6055':'#b32d0f'}">${pc>=70?T().pass:T().fail}</b><span>${T().repPassLabel}</span></div>
    </div><h3>${T().repByCh}</h3>
    ${per.map(p=>{const v=p.ok/p.total*100;return `<div class="chrow">
      <span>${T().chWord(CH[p.ci].id)} · ${D(p.ci).t}</span>
      <span class="tr"><i style="width:${v}%;background:${col(v)}"></i></span>
      <span class="num">${p.ok}/${p.total}</span></div>`}).join('')}
    <h3 style="margin-top:24px">${T().repSugg}</h3>
    ${weak.length?`<p>${T().repWeakMsg(weak.map(p=>T().chWord(CH[p.ci].id)+' '+D(p.ci).t).join(', '))}</p>`:`<p>${T().repGoodMsg}</p>`}
    ${strong.length?`<p class="mut">${T().repStrong(strong.map(p=>T().chWord(CH[p.ci].id)).join(', '))}</p>`:''}`;
  buildCert(pc,ok);
}

/*══ 13. CERTIFICATE ══*/
function buildCert(pc,ok){
  const a=$('certArea');
  if(pc<70){a.innerHTML=`<p class="mut">${T().certLow(fmt(pc,0))}</p>`;return}
  if(!certRef)certRef='SHRM-'+Date.now().toString(36).toUpperCase().slice(-6);
  a.innerHTML=`<div class="noprint" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end">
      <div style="flex:1;min-width:250px"><label>${T().certName}</label><input type="text" id="cName" value="${certName}" placeholder="${T().certPh}" oninput="certNm()"></div>
      <button class="btn pp" onclick="window.print()">${T().certPrint}</button></div>
    <div class="cert"><div class="seal">🏅</div><h3>${T().certHead}</h3>
      <div class="nm" id="cNameOut">${certName||'—'}</div>
      <p class="meta">${T().certBody(ok,QTOTAL,fmt(pc,0))}</p>
      <div class="cfoot">
        <div>${T().certDate(new Date().toLocaleDateString(UI[L].locale,{day:'numeric',month:'long',year:'numeric'}))}</div>
        <div>${T().certRef(certRef)}</div>
      </div></div>`;
}
function certNm(){certName=$('cName').value.trim();$('cNameOut').textContent=certName||'—'}
